:root{
  --teal-900:#0b3948;
  --teal-700:#0f5f68;
  --teal-500:#1c8e85;
  --green-500:#4fa567;
  --green-300:#93c94a;
  --yellow-400:#d7de1f;
  --yellow-300:#eaec86;
  --hold:#b5b199;
  --stopped:#6d6a5e;
  --ink:#122229;
  --ink-soft:#4b5c60;
  --paper:#fbfbf7;
  --paper-dim:#f2f1ea;
  --line:#e2e3d9;
  --white:#ffffff;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ---------- Header ---------- */
.hero{position:relative;overflow:hidden;padding-bottom:56px;}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;display:block;}
.hero-inner{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:44px 28px 0;color:var(--white);}
.hero-profile{
  position:absolute;top:44px;right:28px;z-index:4;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.55);color:var(--white);
  padding:9px 18px;border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:500;
  cursor:pointer;backdrop-filter:blur(6px);transition:background .15s;
}
.hero-profile:hover{background:rgba(255,255,255,.28);}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin-bottom:10px;}
.hero h1{font-size:clamp(30px,4.5vw,46px);line-height:1.05;max-width:640px;}
.hero p.sub{max-width:520px;margin-top:12px;font-size:15.5px;line-height:1.55;opacity:.92;}
.hero-stats{display:flex;gap:28px;margin-top:26px;flex-wrap:wrap;}
.hero-stat{font-family:'IBM Plex Mono',monospace;font-size:12px;opacity:.9;}
.hero-stat b{display:block;font-family:'Fraunces',serif;font-size:22px;font-weight:600;}

/* ---------- Nav ---------- */
.nav-wrap{max-width:1100px;margin:-30px auto 0;padding:0 28px;position:relative;z-index:3;}
.nav{display:flex;gap:6px;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 6px 22px rgba(11,57,72,.10);width:fit-content;}
.nav button{
  border:none;background:transparent;padding:9px 18px;border-radius:999px;
  font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;
  transition:background .15s,color .15s;
}
.nav button.active{background:var(--teal-900);color:var(--white);}
.nav button:hover:not(.active){background:var(--paper-dim);}

.container{max-width:1100px;margin:0 auto;padding:34px 28px 80px;}

/* ---------- Legend ---------- */
.legend{display:flex;gap:0;margin:0 0 10px;border-radius:999px;overflow:hidden;border:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:11px;}
.legend span{flex:1;text-align:center;padding:8px 6px;color:var(--white);}
.legend .lbl-idea{background:var(--teal-900);}
.legend .lbl-exploration{background:var(--teal-500);}
.legend .lbl-inprogress{background:var(--green-500);}
.legend .lbl-incubation{background:var(--green-300);color:var(--ink);}
.legend .lbl-scalability{background:var(--yellow-400);color:var(--ink);}
.legend-paused{display:flex;gap:8px;margin:0 0 30px;font-family:'IBM Plex Mono',monospace;font-size:11px;align-items:center;}
.legend-paused .tag{color:var(--ink-soft);margin-right:2px;}
.legend-paused span.pill{padding:5px 12px;border-radius:999px;color:var(--white);}
.legend-paused .lbl-onhold{background:var(--hold);color:var(--ink);}
.legend-paused .lbl-stopped{background:var(--stopped);}

/* ---------- Region cards (Dashboard) ---------- */
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.section-title h2{font-size:20px;}
.section-title span{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:38px;}
.region-grid{grid-template-columns:repeat(4,1fr);align-items:stretch;}
.region-grid .rcard{display:flex;flex-direction:column;}
.rcard{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;transition:transform .15s, box-shadow .15s;}
.rcard:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(11,57,72,.10);}
.rcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.rcode{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--white);background:var(--teal-900);padding:4px 9px;border-radius:6px;}
.rcard-top .count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
.rcard h3{font-size:17px;margin-bottom:4px;}
.rcard .lead{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
.rcard-site-link{
  margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:11.5px;color:var(--teal-700);cursor:pointer;
}
.rcard-site-link:hover{color:var(--teal-900);}
.rcard-site-link .count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);white-space:nowrap;}

.world-map-wrap{border-radius:var(--radius);margin-bottom:24px;overflow:hidden;box-shadow:0 6px 22px rgba(11,57,72,.12);}
.world-map{width:100%;height:auto;display:block;}
.world-map .flight-path{fill:none;stroke:rgba(255,255,255,.4);stroke-width:1.5;stroke-dasharray:5 5;}
.world-map .pin-link{stroke:rgba(255,255,255,.55);stroke-width:1.5;stroke-dasharray:2 3;}
.map-pin{cursor:pointer;}
.map-pin circle{fill:var(--white);stroke:var(--teal-900);stroke-width:2;transition:r .12s;}
.map-pin text{
  font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:700;fill:var(--white);
  letter-spacing:.03em;text-anchor:middle;pointer-events:none;
}
.map-pin:hover circle{r:12;fill:var(--yellow-300);}
.map-pin-site circle{fill:var(--yellow-300);}
.map-pin-site text{font-size:12px;font-weight:600;fill:var(--white);opacity:.9;text-anchor:start;}
.map-pin-site:hover circle{r:8;}
.statusbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--paper-dim);}
.statusbar div{height:100%;}

/* ---------- Exchange mode ---------- */
.stops{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;}
.stop-pill{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
.stop-pill.active{background:var(--teal-900);border-color:var(--teal-900);color:var(--white);}
.stop-pill-site{border-style:dashed;}
.stop-pill-site.active{background:var(--teal-500);border-color:var(--teal-500);}
.exchange-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
.exchange-head h2{font-size:26px;}
.exchange-head .lead-tag{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:4px;}
.nav-arrows{display:flex;gap:8px;}
.arrow-btn{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px;}
.arrow-btn:hover{background:var(--paper-dim);}
.arrow-btn:disabled{opacity:.35;cursor:not-allowed;}

.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:22px;}
.panel h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);margin-bottom:16px;}

.pcard{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:var(--paper);}
.pcard:last-child{margin-bottom:0;}
.pcard.is-archived{opacity:.7;background:var(--paper-dim);}
.pcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.pcard-fields{flex:1;min-width:200px;}
.pcard-name-input{
  font-weight:600;font-size:14.5px;border:none;background:transparent;width:100%;padding:2px 0;
  font-family:'Inter',sans-serif;color:var(--ink);
}
.pcard-name-input:focus{outline:none;border-bottom:1px solid var(--teal-500);}
.pcard-lead-input{
  font-size:12px;color:var(--ink-soft);border:none;background:transparent;width:100%;padding:1px 0;margin-top:2px;
  font-family:'Inter',sans-serif;
}
.pcard-lead-input:focus{outline:none;border-bottom:1px solid var(--teal-500);}
.pcard-lead-input::placeholder{color:#a9b3af;}
select.status-select{
  font-family:'IBM Plex Mono',monospace;font-size:11px;border:none;border-radius:6px;padding:5px 10px;color:var(--white);cursor:pointer;
}
.pcard-actions{display:flex;gap:14px;margin-top:10px;justify-content:flex-end;}
.pcard-actions button{
  border:none;background:none;cursor:pointer;font-size:11.5px;font-family:'IBM Plex Mono',monospace;
  color:var(--ink-soft);text-decoration:underline;padding:0;
}
.pcard-actions button.danger{color:#b3492f;}

.add-project-form{border:1px dashed var(--line);border-radius:10px;padding:14px 16px;margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.add-project-form input[type=text]{flex:1;min-width:160px;border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:13px;font-family:'Inter',sans-serif;}
.add-project-form button{border:none;background:var(--teal-900);color:var(--white);border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
.add-project-toggle{
  border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin-top:6px;width:100%;background:none;
  text-align:left;color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
}
.add-project-toggle:hover{background:var(--paper-dim);}

.archived-toggle{
  margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);
  cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;
}
.archived-list{margin-top:12px;}

.pcard-image-wrap{margin-top:10px;position:relative;}
.pcard-image{width:100%;max-height:180px;object-fit:cover;border-radius:8px;cursor:zoom-in;display:block;}
.img-loading{font-size:12px;color:var(--ink-soft);padding:10px 0;}
.photo-row{display:flex;gap:14px;align-items:center;margin-top:8px;}
.photo-label{
  font-size:11.5px;font-family:'IBM Plex Mono',monospace;color:var(--teal-700);cursor:pointer;text-decoration:underline;
}
.photo-label input[type=file]{display:none;}
.remove-photo{border:none;background:none;color:#b3492f;font-size:11.5px;font-family:'IBM Plex Mono',monospace;cursor:pointer;text-decoration:underline;padding:0;}
.st-idea{background:var(--teal-900);}
.st-exploration{background:var(--teal-500);}
.st-inprogress{background:var(--green-500);}
.st-incubation{background:var(--green-300);color:var(--ink);}
.st-scalability{background:var(--yellow-400);color:var(--ink);}
.st-onhold{background:var(--hold);color:var(--ink);border:1px dashed rgba(0,0,0,.25) !important;}
.st-stopped{background:var(--stopped);border:1px dashed rgba(255,255,255,.35) !important;}

.pcard textarea{
  width:100%;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  font-family:'Inter',sans-serif;font-size:13px;resize:vertical;min-height:38px;background:var(--white);color:var(--ink);
}
.author-badge{
  flex-shrink:0;width:28px;height:24px;display:flex;align-items:center;justify-content:center;
  background:var(--paper-dim);border:1px solid var(--line);border-radius:8px;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;color:var(--teal-900);
  letter-spacing:.02em;
}
.tasklist{margin-top:10px;}
.task-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;}
.task-row input[type=checkbox]{accent-color:var(--teal-700);width:15px;height:15px;}
.task-row.done span.txt{text-decoration:line-through;color:var(--ink-soft);}
.task-row .del{margin-left:auto;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;}
.addtask{display:flex;gap:6px;margin-top:8px;}
.addtask input{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px;font-family:'Inter',sans-serif;}
.addtask button{border:none;background:var(--teal-700);color:var(--white);border-radius:7px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;}

.snap-region{margin-bottom:14px;}
.snap-region:last-child{margin-bottom:0;}
.snap-region-name{font-weight:600;font-size:13px;margin-bottom:6px;color:var(--teal-900);}
.snap-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line);gap:10px;}
.snap-row:last-child{border-bottom:none;}
.snap-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;color:var(--white);white-space:nowrap;}

.sessionbox textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:'Inter',sans-serif;font-size:13.5px;}
.sessionbox button{margin-top:8px;border:none;background:var(--teal-900);color:var(--white);padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;}
.log-entry{border-left:3px solid var(--teal-500);padding:6px 0 6px 12px;margin-top:10px;font-size:13px;}
.log-entry-head{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.log-actions{display:flex;gap:10px;flex-shrink:0;}
.log-actions button{border:none;background:none;color:var(--ink-soft);font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;text-decoration:underline;padding:0;}
.log-actions button.danger{color:#b3492f;}
.log-edit-box textarea{width:100%;min-height:60px;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:'Inter',sans-serif;font-size:13px;}
.log-edit-box{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.log-edit-box .row{display:flex;gap:8px;}
.log-edit-box button{border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.log-edit-box .save-btn{background:var(--teal-900);color:var(--white);}
.log-edit-box .cancel-btn{background:var(--paper-dim);color:var(--ink-soft);}
.log-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}

/* ---------- Prep ---------- */
.prep-add-form{border:1px dashed var(--line);border-radius:10px;padding:14px 16px;margin-bottom:24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.prep-add-form input[type=text]{flex:1;min-width:200px;border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:13px;font-family:'Inter',sans-serif;}
.prep-add-form select{border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:13px;font-family:'Inter',sans-serif;background:var(--white);}
.prep-add-form button{border:none;background:var(--teal-900);color:var(--white);border-radius:7px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;}
.prep-group{margin-bottom:22px;}
.prep-group h4{font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:6px;}
.prep-row{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line);}
.prep-row:last-child{border-bottom:none;}
.prep-row input[type=checkbox]{accent-color:var(--teal-700);width:15px;height:15px;flex-shrink:0;}
.prep-text-input{flex:1;border:none;background:transparent;font-family:'Inter',sans-serif;font-size:13.5px;padding:2px 0;color:var(--ink);}
.prep-text-input:focus{outline:none;border-bottom:1px solid var(--teal-500);}
.prep-row.done .prep-text-input{text-decoration:line-through;color:var(--ink-soft);}
.prep-row .del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;flex-shrink:0;}

.prep-row-all{padding:8px 0;border-bottom:1px dashed var(--line);}
.prep-row-all:last-child{border-bottom:none;}
.prep-region-grid{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px 0;padding-left:2px;}
.prep-region-chip{
  display:flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--ink-soft);
}
.prep-region-chip input{accent-color:var(--teal-700);width:12px;height:12px;}
.prep-region-chip.checked{background:var(--teal-900);color:var(--white);border-color:var(--teal-900);}

.exchange-prep-add{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap;}
.exchange-prep-add input[type=text]{flex:1;min-width:150px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px;font-family:'Inter',sans-serif;}
.exchange-prep-add label{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.exchange-prep-add button{border:none;background:var(--teal-700);color:var(--white);border-radius:7px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;}

/* ---------- Tasks tab ---------- */
.filterbar{display:flex;gap:8px;margin-bottom:20px;}
.filterbar button{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
.filterbar button.active{background:var(--teal-900);color:var(--white);border-color:var(--teal-900);}
.taskgroup{margin-bottom:22px;}
.taskgroup h4{font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:10px;}
.tg-project{font-size:12px;color:var(--ink-soft);margin:10px 0 4px;}
.empty{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}

footer{max-width:1100px;margin:0 auto;padding:20px 28px 40px;font-size:11.5px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
footer button{background:none;border:none;color:var(--ink-soft);text-decoration:underline;cursor:pointer;font-size:11.5px;font-family:'Inter',sans-serif;padding:0;}
.footer-actions{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
.footer-link{color:var(--ink-soft);text-decoration:underline;cursor:pointer;font-size:11.5px;}
.footer-link input[type=file]{display:none;}
.save-status{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal-700);min-width:70px;transition:opacity .3s;}

@media (max-width:640px){
  .hero{padding-bottom:150px;}
  .hero-inner{padding:32px 18px 0;}
  .hero-profile{position:static;display:inline-block;margin-bottom:14px;}
  .nav-wrap{padding:0 18px;overflow-x:auto;}

let USERS = [], KNOWN_USERS = [], REGION_ACCESS = {};
let usersFromDb = false;
function applyUsers(list){
  USERS = list.map(u=>({name:u.name, access:(u.access||[]).slice(), admin:!!u.admin}));
  KNOWN_USERS = USERS.map(u=>u.name);
  REGION_ACCESS = {};
  USERS.forEach(u=>{ REGION_ACCESS[u.name] = u.access.includes('all') ? 'all' : u.access.slice(); });
}
applyUsers(DEFAULT_USERS);
function isAdminUser(name){ const u = USERS.find(x=>x.name===name); return !!(u && u.admin); }
async function loadUsers(){
  if(!sb) return;
  try{
    const {data, error} = await sb.from('spi_users').select('name,access,admin,sort').order('sort');
    if(error) throw error;
    if(data && data.length){ applyUsers(data); usersFromDb = true; }
  }catch(e){ console.warn('User list not available yet, using defaults:', (e && e.message) || e); }
}
function isRegionAllowed(regionId, user){
  const acc = REGION_ACCESS[user];
  if(!user || !acc || acc==='all') return true;
  return acc.includes(regionId);
}
function allowedStopsFor(user){
  const acc = REGION_ACCESS[user];
  if(!user || !acc || acc==='all') return ALL_STOPS.slice();
  return acc.concat('global');
}
function allowedPrepScopes(user){
  return PREP_SCOPES.filter(s=> s==='all' || s==='global' || isRegionAllowed(s, user));
}

/* ---------------- Storage layer ----------------
   Primary store is a shared Supabase project (tables spi_data / spi_images),
   so every visitor reads/writes the same live data. Every write goes
   through a Postgres RPC function that checks the team passphrase
   server-side (never stored anywhere readable) — see getTeamPass()/sbWrite().
   localStorage is kept as an offline cache/fallback only. */
let currentUser = null;
/* A stored name may no longer exist after a user was renamed or removed in the cockpit. */
function storedUser(){
  let name = '';
  try{ name = localStorage.getItem('spi_currentUser') || ''; }catch(e){}
  if(name && !KNOWN_USERS.includes(name)){ name = ''; try{ localStorage.removeItem('spi_currentUser'); }catch(e){} }
  return name;
}

function showPassModal(){
  return new Promise(resolve=>{
    const old = document.getElementById('passModalOverlay');
    if(old) old.remove();

    overlay.id = 'passModalOverlay';

        </div>
      </div>`;
    document.body.appendChild(overlay);
    const input = document.getElementById('passModalInput');
    input.focus();
    function finish(val){ overlay.remove(); resolve(val); }
    document.getElementById('passModalOk').addEventListener('click', ()=>finish(input.value.trim()));

  });

async function getTeamPass(){
  if(teamPass) return teamPass;
  try{ teamPass = localStorage.getItem('spi_teampass') || ''; }catch(e){}
  if(!teamPass){
    teamPass = await showPassModal();
    if(teamPass){ try{ localStorage.setItem('spi_teampass', teamPass); }catch(e){} }
  }
  return teamPass;
}
function clearTeamPass(){
  teamPass = null;
  try{ localStorage.removeItem('spi_teampass'); }catch(e){}
}
async function sbWrite(fn, params){
  if(!sb) return false;
  const pass = await getTeamPass();
  if(!pass) return false;
  try{
    const { error } = await sb.rpc(fn, Object.assign({}, params, {passphrase: pass}));
    if(error) throw error;
    return true;
  }catch(e){
    console.error('Supabase write failed', e);
    if(String(e && e.message || '').toLowerCase().includes('passphrase')){
      alert('Falsches Team-Passwort — Änderung wurde nicht gespeichert. Bitte neu eingeben.');
      clearTeamPass();
    }
    return false;
  }
}
async function storageSet(key, value){
  let ok = false;
  try{ localStorage.setItem('spi_'+key, value); ok = true; }
  catch(e){ console.error('localStorage write failed', e); }
  if(key === 'spi-tracker-data'){
    if(await sbWrite('save_spi_data', {new_data: value})) ok = true; else usingLocalFallback = true;
  } else if(key.indexOf('img:')===0){
    const projId = key.slice(4);
    if(await sbWrite('save_spi_image', {p_project_id: projId, p_data_url: value})) ok = true; else usingLocalFallback = true;
  }
  return ok;
}
async function storageGet(key){
  if(key === 'spi-tracker-data' && sb){
    try{
      const { data, error } = await sb.from('spi_data').select('data').eq('id', 1).single();
      if(error) throw error;
      if(data && data.data){ localStorage.setItem('spi_'+key, data.data); return data.data; }
    }catch(e){ console.error('Supabase read failed', e); usingLocalFallback = true; }
  } else if(key.indexOf('img:')===0 && sb){
    const projId = key.slice(4);
    try{
      const { data, error } = await sb.from('spi_images').select('data_url').eq('project_id', projId).maybeSingle();
      if(error) throw error;
      if(data && data.data_url) return data.data_url;
    }catch(e){ console.error('Supabase image read failed', e); }
  }
  try{ return localStorage.getItem('spi_'+key); }
  catch(e){ return null; }
}
async function storageDelete(key){
  try{ localStorage.removeItem('spi_'+key); }catch(e){}
  if(key.indexOf('img:')===0){
    const projId = key.slice(4);
    await sbWrite('delete_spi_image', {p_project_id: projId});
  }
}
function attachRealtimeSync(){
  if(!sb) return;
  sb.channel('spi_data_changes')
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'spi_data', filter:'id=eq.1'}, payload=>{
      const val = payload.new && payload.new.data;
      if(!val || val === JSON.stringify(DATA)) return;
      try{
        DATA = JSON.parse(val);
        normalizeData();
        try{ localStorage.setItem('spi_spi-tracker-data', val); }catch(e){}
        renderTab();
      }catch(e){ console.error('bad realtime payload', e); }
    })
    .subscribe();
}

async function loadData(){
  try{
    const val = await storageGet('spi-tracker-data');
    if(val){ DATA = JSON.parse(val); normalizeData(); updateStorageNotice(); return; }
  }catch(e){ /* not found / corrupt */ }
  DATA = defaultData();
  await saveData();
  updateStorageNotice();
}
function normalizeData(){
  const fixProjects = (arr)=>{
    (arr||[]).forEach(p=>{
      if(typeof p.archived!=='boolean') p.archived = false;
      if(typeof p.hasImage!=='boolean') p.hasImage = false;
      if(!p.tasks) p.tasks = [];
      if(typeof p.notes!=='string') p.notes = '';
      if(typeof p.lead!=='string') p.lead = '';
      DETAIL_FIELDS.forEach(f=>{ if(typeof p[f.key]!=='string') p[f.key] = ''; });
      if(typeof p.hideInFunnel!=='boolean') p.hideInFunnel = false;
    });
  };
  const fixLog = (arr)=>{ (arr||[]).forEach(l=>{ if(!l.id) l.id = uid('log'); if(typeof l.author!=='string') l.author = ''; }); };
  DATA.regions.forEach(r=>{ fixProjects(r.projects); fixLog(r.log); });
  fixProjects(DATA.global.projects); fixLog(DATA.global.log);
  if(!DATA.prepItems) DATA.prepItems = [];
  DATA.prepItems.forEach(i=>{
    if(typeof i.author!=='string') i.author = 'Fabio Saxer';
    if(i.scope==='all'){
      if(!Array.isArray(i.doneIn)) i.doneIn = i.done ? ALL_SCOPE_STOPS.slice() : [];
    } else {
      if(typeof i.done!=='boolean') i.done = false;
    }
  });
}
async function saveData(){
  showSaveStatus('saving');
  await storageSet('spi-tracker-data', JSON.stringify(DATA));
  if(document.getElementById('heroStats')) renderHeroStats();
  updateStorageNotice();
  showSaveStatus('saved');
}
function updateStorageNotice(){
  const el = document.getElementById('storageNotice');
  if(!el) return;
  el.textContent = usingLocalFallback
    ? 'Offline — saved only on this device'
    : 'Saved to shared team database';
}
function showSaveStatus(state){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  clearTimeout(showSaveStatus._t);
  if(state==='saving'){
    el.textContent = 'Saving…';
  } else {
    el.textContent = 'Saved ✓';
    showSaveStatus._t = setTimeout(()=>{ el.textContent=''; }, 1600);
  }
}

function allProjectsFlat(){
  const out = [];
  DATA.regions.forEach(r=>r.projects.forEach(p=>out.push({region:r.code, regionName:r.name, project:p})));
  DATA.global.projects.forEach(p=>out.push({region:'GLOBAL', regionName:'Global', project:p}));
  return out;
}
function activeOnly(projects){ return projects.filter(p=>!p.archived); }
function archivedOnly(projects){ return projects.filter(p=>p.archived); }

const PREP_SCOPES = ['all','eur','buz','gcr','mai','ams','global'];
const PREP_STOPS = ['eur','buz','gcr','mai','ams','global'];
/* EUR and GLOBAL have no separate, single responsible person (Fabio Saxer covers
   both already) — "applies to all regions" prep items are only relevant to the
   four regions that have their own dedicated lead. */
const ALL_SCOPE_STOPS = ['buz','gcr','mai','ams'];
/* Organizationally there are 4 regions (EUR, GCR, MAI, AMS). BUZ (Uzwil) is
   Bühler's main site — geographically part of Europe — with its own dedicated
   SPI team, so it's tracked as a separate entity but shown as a site team
   nested under Europe rather than as a 5th peer region. */
const REAL_REGION_IDS = ['eur','gcr','mai','ams'];
const SITE_TEAM_IDS = ['buz'];
function scopeLabel(scope){
  if(scope==='all') return 'All regions';
  if(scope==='global') return 'Global';
  const r = DATA.regions.find(x=>x.id===scope);
  return r ? r.code : scope;
}
function scopeOptionsHtml(selected, scopes){
  return (scopes||PREP_SCOPES).map(s=>`<option value="${s}" ${s===selected?'selected':''}>${scopeLabel(s)}</option>`).join('');
}
function stopLabel(stopId){
  if(stopId==='global') return 'GLOBAL';
  const r = DATA.regions.find(x=>x.id===stopId);
  return r ? r.code : stopId;
}
function isPrepFullyDone(item){
  if(item.scope==='all') return (item.doneIn||[]).length >= ALL_SCOPE_STOPS.length;
  return !!item.done;
}
function isPrepDoneForStop(item, stopId){
  if(item.scope==='all') return (item.doneIn||[]).includes(stopId);
  return !!item.done;
}

function statusBar(projects){
  if(!projects.length) return '<div class="statusbar"></div>';
  const counts = {}; STATUS_ALL.forEach(s=>counts[s]=0);
  projects.forEach(p=>counts[p.status]=(counts[p.status]||0)+1);
  const total = projects.length;
  return '<div class="statusbar">'+STATUS_ALL.map(s=>{
    const w = (counts[s]/total*100).toFixed(1);
    if(counts[s]===0) return '';
    return `<div style="width:${w}%;background:${STATUS_COLOR[s]}" title="${s}: ${counts[s]}"></div>`;
  }).join('')+'</div>';
}

/* A literal continent illustration at this size/detail level reads as messy —
   instead: a "flight path" hub banner in the hero's own gradient, arranged
   west-to-east like a flattened globe, which is honest about being a schematic
   rather than a failed map. */
const MAP_PINS = [
  {id:'ams', code:'AMS', x:120, y:172, labelSide:'below'},
  {id:'eur', code:'EUR', x:380, y:92,  labelSide:'above'},
  {id:'mai', code:'MAI', x:620, y:142, labelSide:'below'},
  {id:'gcr', code:'GCR', x:860, y:110, labelSide:'above'}
];
const BUZ_PIN = {id:'buz', code:'BUZ', x:418, y:140};

function worldMapHtml(){
  const eur = MAP_PINS[1];
  const pinsHtml = MAP_PINS.map(p=>{
    const ty = p.labelSide==='above' ? p.y-20 : p.y+30;
    return `<g class="map-pin" data-region="${p.id}">
      <circle cx="${p.x}" cy="${p.y}" r="9"></circle>
      <text x="${p.x}" y="${ty}">${p.code}</text>
    </g>`;
  }).join('');
  const arcs = [];
  for(let i=0;i<MAP_PINS.length-1;i++){
    const a = MAP_PINS[i], b = MAP_PINS[i+1];
    const cx = (a.x+b.x)/2, cy = Math.min(a.y,b.y)-60;
    arcs.push(`<path class="flight-path" d="M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}"/>`);
  }
  return `<div class="world-map-wrap">
    <svg class="world-map" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0b3948"/>
          <stop offset="45%" stop-color="#12808a"/>
          <stop offset="72%" stop-color="#5cb15e"/>
          <stop offset="100%" stop-color="#dfe61c"/>
        </linearGradient>
      </defs>
      <rect width="1000" height="260" rx="20" fill="url(#mapGrad)"/>
      ${arcs.join('')}
      <line class="pin-link" x1="${eur.x}" y1="${eur.y}" x2="${BUZ_PIN.x}" y2="${BUZ_PIN.y}"></line>
      ${pinsHtml}
      <g class="map-pin map-pin-site" data-region="${BUZ_PIN.id}">
        <circle cx="${BUZ_PIN.x}" cy="${BUZ_PIN.y}" r="6"></circle>
        <text x="${BUZ_PIN.x+38}" y="${BUZ_PIN.y+4}">${BUZ_PIN.code}</text>
      </g>
    </svg>
  </div>`;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  if(!name) return '';
  const parts = name.trim().split(/\s+/);
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

function fileToCompressedDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1000;
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };
      img.onerror = ()=>reject(new Error('Could not read image'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function renderExchange(){
  exchangeStops = allowedStopsFor(currentUser);
  if(pendingStopId){
    const idx = exchangeStops.indexOf(pendingStopId);
    exchangeIdx = idx>=0 ? idx : 0;
    pendingStopId = null;
  } else if(exchangeIdx>=exchangeStops.length || exchangeIdx<0){
    exchangeIdx = 0;
  }
  const stopId = exchangeStops[exchangeIdx];
  const stop = getStopData(stopId);

  let html = `<div class="stops">`;
  exchangeStops.forEach((sid,i)=>{
    const label = sid==='global' ? 'GLOBAL' : DATA.regions.find(r=>r.id===sid).code;
    const siteClass = SITE_TEAM_IDS.includes(sid) ? ' stop-pill-site' : '';
    html += `<div class="stop-pill${siteClass} ${i===exchangeIdx?'active':''}" data-idx="${i}">${label}</div>`;
  });
  html += `</div>`;

  html += `<div class="exchange-head">
    <div>
      <h2>${stop.isGlobal ? 'Global Coordinated Projects' : stop.name}</h2>
      <div class="lead-tag">${stop.lead}</div>
    </div>
    <div class="nav-arrows">
      <button class="arrow-btn" id="prevStop" ${exchangeIdx===0?'disabled':''}>&larr; Previous</button>
      <button class="arrow-btn" id="nextStop" ${exchangeIdx===exchangeStops.length-1?'disabled':''}>Next &rarr;</button>
    </div>
  </div>`;

  const relevantPrep = DATA.prepItems.filter(i=>!isPrepDoneForStop(i, stopId) && ((i.scope==='all' && ALL_SCOPE_STOPS.includes(stopId)) || i.scope===stopId));
  html += `<div class="panel"><h4>Prep — things to raise</h4>`;
  if(relevantPrep.length){
    relevantPrep.forEach(i=>{
      const progress = i.scope==='all' ? ` <span class="mono" style="font-size:10px;color:var(--ink-soft);">(all regions — ${(i.doneIn||[]).length}/${ALL_SCOPE_STOPS.length} addressed)</span>` : '';
      html += `<div class="prep-row" data-prep="${i.id}">
        <input type="checkbox" data-action="check-prep" data-prep="${i.id}">
        <span style="flex:1;">${escapeHtml(i.text)}${progress}</span>
        ${i.author?`<div class="author-badge" title="${escapeHtml(i.author)}">${escapeHtml(initials(i.author))}</div>`:''}
      </div>`;
    });
  } else {
    html += `<div class="empty" style="padding:10px 0;">Nothing prepared for this stop yet.</div>`;
  }
  html += `<div class="exchange-prep-add">
    <input type="text" id="quickPrepText" placeholder="Add something to raise...">
    <label><input type="checkbox" id="quickPrepAll"> applies to all regions</label>
    <button id="quickPrepAdd">Add</button>
  </div></div>`;

  const activeProjects = activeOnly(stop.projects);
  const archived = archivedOnly(stop.projects);

  html += `<div class="panel"><h4>${stop.isGlobal ? 'Global Projects' : "This region's projects"}</h4>`;
  html += `<datalist id="catOptions">${classificationOptions().map(c=>`<option value="${escapeHtml(c)}">`).join('')}</datalist>`;
  html += activeProjects.length ? activeProjects.map(p=>projectCardHtml(p, stopId)).join('') : `<div class="empty" style="padding:20px 0;">No active projects yet — add the first one below.</div>`;
  html += `<button class="add-project-toggle" id="addProjectToggle">+ Add a project</button>
    <div class="add-project-form" id="addProjectForm" style="display:none;">
      <input type="text" id="newProjectName" placeholder="Project name">
      <input type="text" id="newProjectLead" placeholder="Name (optional)" style="max-width:160px;">
      <button id="newProjectSave">Add project</button>
    </div>`;
  if(archived.length){
    html += `<button class="archived-toggle" id="archivedToggle">Show archived / completed (${archived.length})</button>
      <div class="archived-list" id="archivedList" style="display:none;">
        ${archived.map(p=>projectCardHtml(p, stopId, {readOnly:true})).join('')}
      </div>`;
  }
  html += `</div>`;

  if(!stop.isGlobal){
    html += `<div class="panel"><h4>Snapshot — what's happening in other regions</h4>`;
    DATA.regions.filter(r=>r.id!==stopId).forEach(r=>{
      const rActive = activeOnly(r.projects);
      if(!rActive.length) return;
      html += `<div class="snap-region"><div class="snap-region-name">${r.code} — ${r.lead}</div>`;
      rActive.forEach(p=>{
        html += `<div class="snap-row"><span>${escapeHtml(p.name)}</span><span class="snap-badge" style="background:${STATUS_COLOR[p.status]};${statusTextStyle(p.status)}">${p.status}</span></div>`;
      });
      html += `</div>`;
    });
    const gActive = activeOnly(DATA.global.projects);
    if(gActive.length){
      html += `<div class="snap-region"><div class="snap-region-name">GLOBAL — ${DATA.global.lead}</div>`;
      gActive.forEach(p=>{
        html += `<div class="snap-row"><span>${escapeHtml(p.name)}</span><span class="snap-badge" style="background:${STATUS_COLOR[p.status]};${statusTextStyle(p.status)}">${p.status}</span></div>`;

    }

  html += `<div class="panel sessionbox"><h4>Session note</h4>

      </div>
      <div class="log-text">${escapeHtml(l.text)}</div>
    </div>`;
  });
  html += `</div></div>`;

  document.getElementById('container').innerHTML = html;
  attachExchangeEvents(stopId, stop.isGlobal);
  loadCardImages();
}

function attachExchangeEvents(stopId, isGlobal){
  document.querySelectorAll('.stop-pill').forEach(el=>{
    el.addEventListener('click', ()=>{ exchangeIdx = parseInt(el.getAttribute('data-idx')); renderExchange(); });
  });
  const prev = document.getElementById('prevStop');
  const next = document.getElementById('nextStop');
  if(prev) prev.addEventListener('click', ()=>{ if(exchangeIdx>0){exchangeIdx--; renderExchange();} });
  if(next) next.addEventListener('click', ()=>{ if(exchangeIdx<exchangeStops.length-1){exchangeIdx++; renderExchange();} });

  function findProjectArr(ownerKey){
    if(ownerKey==='global') return DATA.global.projects;
    return DATA.regions.find(r=>r.id===ownerKey).projects;
  }

  document.querySelectorAll('[data-action="set-status"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const arr = findProjectArr(el.getAttribute('data-owner'));
      const p = arr.find(x=>x.id===el.getAttribute('data-project'));
      p.status = el.value;
      await saveData();
      renderExchange();
    });
  });

  document.querySelectorAll('[data-action="set-notes"]').forEach(el=>{
    el.addEventListener('blur', async ()=>{
      const arr = findProjectArr(el.getAttribute('data-owner'));
      const p = arr.find(x=>x.id===el.getAttribute('data-project'));
      p.notes = el.value;
      await saveData();
    });
  });

  document.querySelectorAll('[data-action="set-field"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const arr = findProjectArr(el.getAttribute('data-owner'));
      const p = arr.find(x=>x.id===el.getAttribute('data-project'));
      const key = el.getAttribute('data-field');
      const val = el.value.trim();
      if((p[key]||'')===val) return;
      p[key] = key==='classification' && val ? catInfo(val).label : val;
      await saveData();
    });
  });
  document.querySelectorAll('[data-action="toggle-funnel"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const arr = findProjectArr(el.getAttribute('data-owner'));
      const p = arr.find(x=>x.id===el.getAttribute('data-project'));
      p.hideInFunnel = !el.checked;
      await saveData();
    });
  });
  document.querySelectorAll('details.pdetails').forEach(d=>{
    d.addEventListener('toggle', ()=>{
      const id = d.getAttribute('data-details');
      if(d.open) openDetailSections.add(id); else openDetailSections.delete(id);
    });
  });

  document.querySelectorAll('[data-action="set-name"]').forEach(el=>{
    el.addEventListener('blur', async ()=>{
      const arr = findProjectArr(el.getAttribute('data-owner'));
      const p = arr.find(x=>x.id===el.getAttribute('data-project'));
      const val = el.value.trim();
      if(val) p.name = val; else el.value = p.name;
      await saveData();
    });
  });

  document.querySelectorAll('[data-action="set-lead"]').forEach(el=>{
    el.addEventListener('blur', async ()=>{
      const arr = findProjectArr(el.getAttribute('data-owner'));
      const p = arr.find(x=>x.id===el.getAttribute('data-project'));
      p.lead = el.value.trim();
      await saveData();
    });
  });

  document.querySelectorAll('[data-action="archive-project"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const arr = findProjectArr(el.getAttribute('data-owner'));
      const p = arr.find(x=>x.id===el.getAttribute('data-project'));
      p.archived = true;
      await saveData();
      renderExchange();
    });
  });

  document.querySelectorAll('[data-action="restore-project"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const arr = findProjectArr(el.getAttribute('data-owner'));
      const p = arr.find(x=>x.id===el.getAttribute('data-project'));
      p.archived = false;
      await saveData();
      renderExchange();
    });
  });

  document.querySelectorAll('[data-action="delete-project"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('Delete this project permanently? This cannot be undone.')) return;
      const owner = el.getAttribute('data-owner');
      const projId = el.getAttribute('data-project');
      await deleteProjectImage(projId);
      if(owner==='global'){ DATA.global.projects = DATA.global.projects.filter(x=>x.id!==projId); }
      else { const r = DATA.regions.find(x=>x.id===owner); r.projects = r.projects.filter(x=>x.id!==projId); }
      await saveData();
      renderExchange();
    });
  });

  document.querySelectorAll('[data-action="upload-image"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const file = el.files && el.files[0];
      if(!file) return;
      const owner = el.getAttribute('data-owner');
      const projId = el.getAttribute('data-project');
      const label = el.closest('.photo-label');
      const originalText = label.childNodes[0].textContent;
      label.childNodes[0].textContent = 'Uploading...';
      try{
        const dataUrl = await fileToCompressedDataUrl(file);
        const ok = await saveProjectImage(projId, dataUrl);
        if(ok){
          const arr = findProjectArr(owner);
          const p = arr.find(x=>x.id===projId);
          p.hasImage = true;
          await saveData();
          renderExchange();
        } else {
          alert('Could not save the photo. Please try a smaller image.');
          label.childNodes[0].textContent = originalText;
        }
      }catch(e){
        alert('Could not read that image file.');
        label.childNodes[0].textContent = originalText;
      }
    });
  });

  document.querySelectorAll('[data-action="remove-image"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('Remove this photo?')) return;
      const owner = el.getAttribute('data-owner');
      const projId = el.getAttribute('data-project');
      await deleteProjectImage(projId);
      const arr = findProjectArr(owner);
      const p = arr.find(x=>x.id===projId);
      p.hasImage = false;
      await saveData();
      renderExchange();
    });
  });

  const addToggle = document.getElementById('addProjectToggle');
  const addForm = document.getElementById('addProjectForm');
  if(addToggle){
    addToggle.addEventListener('click', ()=>{
      addForm.style.display = addForm.style.display==='none' ? 'flex' : 'none';
      if(addForm.style.display==='flex') document.getElementById('newProjectName').focus();
    });
  }
  const newProjectSave = document.getElementById('newProjectSave');
  if(newProjectSave){
    newProjectSave.addEventListener('click', async ()=>{
      const nameInput = document.getElementById('newProjectName');
      const leadInput = document.getElementById('newProjectLead');
      const name = nameInput.value.trim();
      if(!name) { nameInput.focus(); return; }
      const newP = {id:uid('p'), name, lead:leadInput.value.trim(), status:'Idea', notes:'', tasks:[], archived:false, hasImage:false};
      const arr = findProjectArr(stopId);
      arr.push(newP);
      await saveData();
      renderExchange();
    });
  }

  const archivedToggle = document.getElementById('archivedToggle');
  if(archivedToggle){
    archivedToggle.addEventListener('click', ()=>{
      const list = document.getElementById('archivedList');
      list.style.display = list.style.display==='none' ? 'block' : 'none';
    });
  }

  document.querySelectorAll('[data-action="check-prep"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const item = DATA.prepItems.find(i=>i.id===el.getAttribute('data-prep'));
      if(!el.checked) return; // items only appear here while open; checking marks this stop as addressed
      if(item.scope==='all'){
        item.doneIn = item.doneIn || [];
        if(!item.doneIn.includes(stopId)) item.doneIn.push(stopId);
      } else {
        item.done = true;
      }
      await saveData();
      renderExchange();
    });
  });

  const quickPrepAdd = document.getElementById('quickPrepAdd');
  if(quickPrepAdd){
    quickPrepAdd.addEventListener('click', async ()=>{
      const input = document.getElementById('quickPrepText');
      const allChecked = document.getElementById('quickPrepAll').checked;
      const text = input.value.trim();
      if(!text) { input.focus(); return; }
      const scope = allChecked ? 'all' : stopId;
      const author = await getCurrentUser();
      DATA.prepItems.push({id:uid('prep'), text, scope, done:false, doneIn:[], created:new Date().toISOString().slice(0,10), author});
      await saveData();
      renderExchange();
    });
  }

  document.querySelectorAll('[data-action="add-task"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const owner = el.getAttribute('data-owner');
      const projId = el.getAttribute('data-project');
      const input = document.querySelector(`.new-task-input[data-owner="${owner}"][data-project="${projId}"]`);
      const text = input.value.trim();
      if(!text) return;
      const arr = findProjectArr(owner);
      const p = arr.find(x=>x.id===projId);
      p.tasks = p.tasks || [];
      p.tasks.push({id:uid('t'), text, done:false, date:new Date().toISOString().slice(0,10)});
      await saveData();
      renderExchange();
    });
  });

  document.querySelectorAll('[data-action="toggle-task"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const arr = findProjectArr(el.getAttribute('data-owner'));
      const p = arr.find(x=>x.id===el.getAttribute('data-project'));
      const t = p.tasks.find(x=>x.id===el.getAttribute('data-task-id'));
      t.done = el.checked;
      await saveData();
      renderExchange();
    });
  });

  document.querySelectorAll('[data-action="del-task"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const arr = findProjectArr(el.getAttribute('data-owner'));
      const p = arr.find(x=>x.id===el.getAttribute('data-project'));
      p.tasks = p.tasks.filter(x=>x.id!==el.getAttribute('data-task-id'));
      await saveData();
      renderExchange();
    });
  });

  const saveNoteBtn = document.getElementById('saveSessionNote');
  if(saveNoteBtn){
    saveNoteBtn.addEventListener('click', async ()=>{
      const input = document.getElementById('sessionNoteInput');
      const text = input.value.trim();
      if(!text) return;
      const author = await getCurrentUser();
      const entry = {id:uid('log'), date:new Date().toISOString().slice(0,10), text, author};
      if(isGlobal){ DATA.global.log = DATA.global.log||[]; DATA.global.log.push(entry); }
      else { const r = DATA.regions.find(x=>x.id===stopId); r.log = r.log||[]; r.log.push(entry); }
      await saveData();
      renderExchange();
    });
  }

  function findLogArr(){ return isGlobal ? DATA.global.log : DATA.regions.find(x=>x.id===stopId).log; }

  document.querySelectorAll('[data-action="delete-log"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('Delete this session note?')) return;
      const arr = findLogArr();
      const idx = arr.findIndex(x=>x.id===el.getAttribute('data-log'));
      if(idx>-1) arr.splice(idx,1);
      await saveData();
      renderExchange();
    });
  });

  document.querySelectorAll('[data-action="edit-log"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const entryEl = document.querySelector(`.log-entry[data-log="${el.getAttribute('data-log')}"]`);
      const arr = findLogArr();
      const entry = arr.find(x=>x.id===el.getAttribute('data-log'));
      const textEl = entryEl.querySelector('.log-text');
      textEl.outerHTML = `<div class="log-edit-box">
        <textarea class="log-edit-input">${escapeHtml(entry.text)}</textarea>
        <div class="row">
          <button class="save-btn" data-action="save-log-edit" data-log="${entry.id}">Save</button>
          <button class="cancel-btn" data-action="cancel-log-edit" data-log="${entry.id}">Cancel</button>
        </div>
      </div>`;
      attachLogEditButtons();
    });
  });

  function attachLogEditButtons(){
    document.querySelectorAll('[data-action="save-log-edit"]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const entryEl = btn.closest('.log-entry');
        const textarea = entryEl.querySelector('.log-edit-input');
        const newText = textarea.value.trim();
        if(!newText) return;
        const arr = findLogArr();
        const entry = arr.find(x=>x.id===btn.getAttribute('data-log'));
        entry.text = newText;
        await saveData();
        renderExchange();
      });
    });
    document.querySelectorAll('[data-action="cancel-log-edit"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ renderExchange(); });
    });
  }
}

/* ---------------- Prep ---------------- */
function renderPrep(){
  let html = `<div class="section-title"><h2>Meeting Prep</h2><span>things to bring up in your next exchanges</span></div>`;
  html += `<div class="prep-add-form">
    <input type="text" id="prepNewText" placeholder="Something to raise...">
    <select id="prepNewScope">${scopeOptionsHtml('all', allowedPrepScopes(currentUser))}</select>
    <button id="prepAddBtn">Add</button>
  </div>`;

  html += `<div class="filterbar">
    <button data-pf="open" class="${prepFilter==='open'?'active':''}">Open</button>
    <button data-pf="done" class="${prepFilter==='done'?'active':''}">Done</button>
    <button data-pf="all" class="${prepFilter==='all'?'active':''}">All</button>
  </div>`;

  let any = false;
  PREP_SCOPES.forEach(scope=>{
    let items = DATA.prepItems.filter(i=>i.scope===scope && i.author===currentUser);
    if(prepFilter==='open') items = items.filter(i=>!isPrepFullyDone(i));
    if(prepFilter==='done') items = items.filter(i=>isPrepFullyDone(i));
    if(!items.length) return;
    any = true;
    html += `<div class="prep-group"><h4>${scopeLabel(scope)}</h4>`;
    items.forEach(i=>{
      if(i.scope==='all'){
        const doneIn = i.doneIn||[];
        html += `<div class="prep-row-all" data-prep="${i.id}">
          <div class="prep-row" style="border-bottom:none;">
            <input type="text" class="prep-text-input" value="${escapeHtml(i.text)}" data-action="edit-prep" data-prep="${i.id}">
            ${i.author?`<div class="author-badge" title="${escapeHtml(i.author)}">${escapeHtml(initials(i.author))}</div>`:''}
            <button class="del" data-action="delete-prep" data-prep="${i.id}">&times;</button>
          </div>
          <div class="prep-region-grid">
            ${ALL_SCOPE_STOPS.map(sid=>`<label class="prep-region-chip ${doneIn.includes(sid)?'checked':''}">
              <input type="checkbox" ${doneIn.includes(sid)?'checked':''} data-action="toggle-prep-region" data-prep="${i.id}" data-stop="${sid}">
              ${stopLabel(sid)}
            </label>`).join('')}
          </div>
        </div>`;
      } else {
        html += `<div class="prep-row ${i.done?'done':''}" data-prep="${i.id}">
          <input type="checkbox" ${i.done?'checked':''} data-action="toggle-prep" data-prep="${i.id}">
          <input type="text" class="prep-text-input" value="${escapeHtml(i.text)}" data-action="edit-prep" data-prep="${i.id}">
          ${i.author?`<div class="author-badge" title="${escapeHtml(i.author)}">${escapeHtml(initials(i.author))}</div>`:''}
          <button class="del" data-action="delete-prep" data-prep="${i.id}">&times;</button>
        </div>`;
      }
    });
    html += `</div>`;
  });
  if(!any){
    html += `<div class="empty">No ${prepFilter==='all'?'':prepFilter+' '}prep notes yet — add what you want to raise above.</div>`;
  }

  document.getElementById('container').innerHTML = html;

  document.querySelectorAll('.filterbar button[data-pf]').forEach(el=>{
    el.addEventListener('click', ()=>{ prepFilter = el.getAttribute('data-pf'); renderPrep(); });
  });

  document.getElementById('prepAddBtn').addEventListener('click', async ()=>{
    const input = document.getElementById('prepNewText');
    const scope = document.getElementById('prepNewScope').value;
    const text = input.value.trim();
    if(!text) { input.focus(); return; }
    const author = await getCurrentUser();
    DATA.prepItems.push({id:uid('prep'), text, scope, done:false, doneIn:[], created:new Date().toISOString().slice(0,10), author});
    await saveData();
    renderPrep();
  });

  document.querySelectorAll('[data-action="toggle-prep"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const item = DATA.prepItems.find(i=>i.id===el.getAttribute('data-prep'));
      item.done = el.checked;
      await saveData();
      renderPrep();
    });
  });

  document.querySelectorAll('[data-action="toggle-prep-region"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const item = DATA.prepItems.find(i=>i.id===el.getAttribute('data-prep'));
      const sid = el.getAttribute('data-stop');
      item.doneIn = item.doneIn || [];
      if(el.checked){ if(!item.doneIn.includes(sid)) item.doneIn.push(sid); }
      else { item.doneIn = item.doneIn.filter(x=>x!==sid); }
      await saveData();
      renderPrep();
    });
  });

  document.querySelectorAll('[data-action="edit-prep"]').forEach(el=>{
    el.addEventListener('blur', async ()=>{
      const item = DATA.prepItems.find(i=>i.id===el.getAttribute('data-prep'));
      const val = el.value.trim();
      if(val) item.text = val; else el.value = item.text;
      await saveData();
    });
  });

  document.querySelectorAll('[data-action="delete-prep"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      DATA.prepItems = DATA.prepItems.filter(i=>i.id!==el.getAttribute('data-prep'));
      await saveData();
      renderPrep();
    });
  });
}

/* ---------------- Tasks tab ---------------- */
function renderTasks(){
  let html = `<div class="filterbar">
    <button data-f="open" class="${taskFilter==='open'?'active':''}">Open</button>
    <button data-f="done" class="${taskFilter==='done'?'active':''}">Done</button>
    <button data-f="all" class="${taskFilter==='all'?'active':''}">All</button>
  </div>`;

  const groups = [];
  DATA.regions.forEach(r=>{
    if(!isRegionAllowed(r.id, currentUser)) return;
    groups.push({label:r.code+' — '+r.name.split('(')[0].trim(), projects:r.projects});
  });
  groups.push({label:'GLOBAL — Global Coordinated Projects', projects:DATA.global.projects});

  let any = false;
  groups.forEach(g=>{
    let groupHtml = '';
    activeOnly(g.projects).forEach(p=>{
      let tasks = p.tasks||[];
      if(taskFilter==='open') tasks = tasks.filter(t=>!t.done);
      if(taskFilter==='done') tasks = tasks.filter(t=>t.done);
      if(!tasks.length) return;
      groupHtml += `<div class="tg-project">${escapeHtml(p.name)}</div>`;
      tasks.forEach(t=>{
        any = true;
        groupHtml += `<div class="task-row ${t.done?'done':''}">
          <input type="checkbox" ${t.done?'checked':''} data-tt-project="${p.id}" data-tt-task="${t.id}">
          <span class="txt">${escapeHtml(t.text)}</span>
          <span class="mono" style="font-size:11px;color:var(--ink-soft);margin-left:6px;">${t.date}</span>
        </div>`;
      });
    });
    if(groupHtml){
      html += `<div class="taskgroup"><h4>${g.label}</h4>${groupHtml}</div>`;
    }
  });

  if(!any){
    html += `<div class="empty">No ${taskFilter==='all'?'':taskFilter+' '}follow-up tasks yet.</div>`;
  }

  document.getElementById('container').innerHTML = html;

  document.querySelectorAll('.filterbar button').forEach(el=>{
    el.addEventListener('click', ()=>{ taskFilter = el.getAttribute('data-f'); renderTasks(); });
  });

  document.querySelectorAll('[data-tt-task]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const projId = el.getAttribute('data-tt-project');
      const taskId = el.getAttribute('data-tt-task');
      const all = allProjectsFlat();
      const found = all.find(x=>x.project.id===projId);
      const t = found.project.tasks.find(x=>x.id===taskId);
      t.done = el.checked;
      await saveData();
      renderTasks();
    });
  });
}

/* Silhouette from the BUZ tool: two cubic-Bézier edges in a 1000x420 space. They are sampled
   once into polylines and cut into five bands, one per stage. */
const FUNNEL_W = 1000, FUNNEL_H = 420;
const FUNNEL_TOP_NODES = [[0,8],[90,8],[170,22],[240,40],[320,53],[380,64],[440,74],[560,84],[640,91],[720,95],[820,104],[920,111],[1000,116]];
const FUNNEL_BOT_NODES = [[0,412],[90,412],[170,398],[240,380],[320,367],[380,356],[440,346],[560,336],[640,329],[720,325],[820,316],[920,309],[1000,304]];
const FUNNEL_SPLITS = [0,200,400,600,800,1000];
function cubicAt(p0,p1,p2,p3,t){
  const u = 1-t;
  return [u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],
          u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]];
}
function sampleEdge(nodes){
  const out = [];
  for(let seg=0; seg<(nodes.length-1)/3; seg++){
    const i = seg*3;
    for(let k=(seg?1:0); k<=40; k++) out.push(cubicAt(nodes[i],nodes[i+1],nodes[i+2],nodes[i+3],k/40));
  }
  return out;
}
const EDGE_TOP = sampleEdge(FUNNEL_TOP_NODES), EDGE_BOT = sampleEdge(FUNNEL_BOT_NODES);
function edgeY(edge, x){
  for(let j=1; j<edge.length; j++){
    if(edge[j][0] >= x){
      const a = edge[j-1], b = edge[j];
      const t = (x-a[0])/((b[0]-a[0])||1);
      return a[1] + t*(b[1]-a[1]);
    }
  }
  return edge[edge.length-1][1];
}
function bandPolygon(i, samples=14){
  const x0 = FUNNEL_SPLITS[i], x1 = FUNNEL_SPLITS[i+1], top = [], bot = [];
  for(let k=0; k<samples; k++){
    const x = x0 + (x1-x0)*k/(samples-1);
    top.push([x, edgeY(EDGE_TOP,x)]);
    bot.push([x, edgeY(EDGE_BOT,x)]);
  }
  return top.concat(bot.reverse());
}
/* Safe inner rectangle per band in % of the canvas. The funnel narrows to the right, so the
   right edge of each band is its tightest point and sets the usable height. */
const FUNNEL_BOUNDS = STATUS_ORDER.map((s,i)=>{
  const x0 = FUNNEL_SPLITS[i], x1 = FUNNEL_SPLITS[i+1];
  const top = edgeY(EDGE_TOP,x1), bot = edgeY(EDGE_BOT,x1), pad = 6;
  return {left:x0/FUNNEL_W*100, width:(x1-x0)/FUNNEL_W*100, top:(top+pad)/FUNNEL_H*100, height:(bot-top-2*pad)/FUNNEL_H*100};
});
function funnelSvg(){
  const d = pts=>'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')+' Z';
  const bands = STATUS_ORDER.map((s,i)=>`<path d="${d(bandPolygon(i))}" fill="#${STAGE_HEX[s]}"/>`).join('');
  const seams = [1,2,3,4].map(k=>{
    const x = FUNNEL_SPLITS[k];
    return `<line x1="${x}" y1="${edgeY(EDGE_TOP,x)}" x2="${x}" y2="${edgeY(EDGE_BOT,x)}" stroke="#ffffff" stroke-width="2.5"/>`;
  }).join('');
  const outline = `<path d="${d(EDGE_TOP.concat(EDGE_BOT.slice().reverse()))}" fill="none" stroke="rgba(11,40,56,0.35)" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${FUNNEL_W} ${FUNNEL_H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${bands}${seams}${outline}</svg>`;
}

let funnelScope = 'all';
let funnelCat = '';
function funnelScopeLabel(scope){
  if(scope==='all') return 'All';
  if(scope==='global') return 'Global';
  const r = DATA.regions.find(x=>x.id===scope);
  return r ? r.code : scope;
}
function funnelTitle(){ return funnelScope==='all' ? 'SPI Global Funnel' : funnelScopeLabel(funnelScope)+' Project Funnel'; }
/* Everything in the current scope, including projects hidden from the funnel. */
function funnelScopeItems(){
  const out = [];
  DATA.regions.forEach(r=>{
    if(funnelScope!=='all' && funnelScope!==r.id) return;
    r.projects.forEach(p=>out.push({p, id:p.id, title:p.name, rid:r.id, code:r.code, rname:r.name}));
  });
  if(funnelScope==='all' || funnelScope==='global'){
    DATA.global.projects.forEach(p=>out.push({p, id:p.id, title:p.name, rid:'global', code:'GLOBAL', rname:'Global Coordinated Projects'}));
  }
  return out;
}
function funnelItemsAll(){ return funnelScopeItems().filter(x=>!x.p.hideInFunnel); }
function funnelItems(){
  const all = funnelItemsAll();
  return funnelCat ? all.filter(x=>catInfo(x.p.classification).label===funnelCat) : all;
}
function funnelGroups(items){
  return {
    bands: STATUS_ORDER.map(s=>items.filter(x=>!x.p.archived && x.p.status===s)),
    onHold: items.filter(x=>!x.p.archived && x.p.status==='On Hold'),
    stopped: items.filter(x=>!x.p.archived && x.p.status==='Stopped'),
    archived: items.filter(x=>x.p.archived)
  };
}
/* Visual order — the same order the detail pages and the detail slides follow. */
function funnelOrdered(g){ return [].concat(...g.bands, g.onHold, g.stopped, g.archived); }

function ftokHtml(x, tone){
  const ci = catInfo(x.p.classification);
  const tip = `${x.title} · ${x.code}${x.p.classification?' · '+ci.label:''}`;
  return `<div class="ftok ${tone||''}" data-fid="${x.id}" title="${escapeHtml(tip)}"><span>${escapeHtml(x.title)}</span>${tone?'':`<span class="fbadge" style="background:${ci.bg};color:${ci.fg}">${escapeHtml(ci.code)}</span>`}</div>`;
}

function renderFunnelTab(){
  const itemsAll = funnelItemsAll();
  const usedCats = Array.from(new Set(itemsAll.map(x=>catInfo(x.p.classification).label)));
  if(funnelCat && !usedCats.includes(funnelCat)) funnelCat = '';
  const items = funnelItems();
  const g = funnelGroups(items);
  const inFunnel = g.bands.reduce((n,b)=>n+b.length, 0);

  const hiddenCount = funnelScopeItems().filter(x=>x.p.hideInFunnel).length;
  const hiddenNote = hiddenCount ? ` · ${hiddenCount} project${hiddenCount!==1?'s':''} hidden (Exchange Mode → "Show in funnel")` : '';
  let html = `<div class="section-title"><h2>Project Funnel</h2><span>tap a project to open its detail sheet${hiddenNote}</span></div>`;
  html += `<div class="funnel-toolbar">
    <div class="funnel-scope">${['all'].concat(ALL_STOPS).map(s=>`<div class="stop-pill${SITE_TEAM_IDS.includes(s)?' stop-pill-site':''} ${s===funnelScope?'active':''}" data-fscope="${s}">${funnelScopeLabel(s)}</div>`).join('')}</div>
    <div class="funnel-actions">
      <select id="funnelCatSel" aria-label="Filter by classification"><option value="">All classifications</option>${usedCats.map(c=>`<option value="${escapeHtml(c)}" ${c===funnelCat?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select>
      <button class="fbtn" id="funnelPptxBtn">PowerPoint</button>
      <button class="fbtn" id="funnelPdfBtn">PDF</button>
    </div>
  </div>`;
  html += `<div class="funnel-stats">${[['Projects',items.length],['Active in funnel',inFunnel],['On hold / stopped',g.onHold.length+g.stopped.length],['Archived',g.archived.length]].map(s=>`<div class="fstat"><b>${s[1]}</b><small>${s[0]}</small></div>`).join('')}</div>`;

  const legendCats = Array.from(new Set(items.map(x=>catInfo(x.p.classification).label))).map(l=>catInfo(l==='Unclassified'?'':l));
  html += `<div class="funnel-capture" id="funnelCapture">
    <div class="funnel-lbls">${STATUS_ORDER.map((s,i)=>`<div style="left:${FUNNEL_BOUNDS[i].left}%;width:${FUNNEL_BOUNDS[i].width}%">${s}</div>`).join('')}</div>
    <div class="funnel-canvas" id="funnelCanvas">${funnelSvg()}${STATUS_ORDER.map((s,i)=>{
      const b = FUNNEL_BOUNDS[i];
      return `<div class="fstage" style="left:${b.left}%;top:${b.top}%;width:${b.width}%;height:${b.height}%"><div class="fstage-inner">${g.bands[i].length ? g.bands[i].map(x=>ftokHtml(x)).join('') : '<span class="fempty">–</span>'}</div></div>`;
    }).join('')}</div>
    <div class="funnel-side">${[['On hold',g.onHold,'gray'],['Stopped',g.stopped,'gray'],['Archived',g.archived,'dark']].map(([label,list,tone])=>`<div class="fside"><h4>${label}</h4><div class="fside-wrap">${list.length ? list.map(x=>ftokHtml(x,tone)).join('') : '<span class="fempty">–</span>'}</div></div>`).join('')}</div>
    ${legendCats.length ? `<div class="funnel-legend"><b>Classification</b>${legendCats.map(ci=>`<span><i class="catdot" style="background:${ci.bg};color:${ci.fg}">${escapeHtml(ci.code)}</i>${escapeHtml(ci.label)}</span>`).join('')}</div>` : ''}
  </div>`;

  document.getElementById('container').innerHTML = html;
  document.querySelectorAll('[data-fscope]').forEach(el=>el.addEventListener('click', ()=>{ funnelScope = el.getAttribute('data-fscope'); renderFunnelTab(); }));
  document.getElementById('funnelCatSel').addEventListener('change', e=>{ funnelCat = e.target.value; renderFunnelTab(); });
  document.getElementById('funnelPptxBtn').addEventListener('click', e=>runExport(e.currentTarget, exportFunnelPptx));
  document.getElementById('funnelPdfBtn').addEventListener('click', e=>runExport(e.currentTarget, exportFunnelPdf));
  document.querySelectorAll('.ftok[data-fid]').forEach(el=>el.addEventListener('click', ()=>openFunnelDetail(el.getAttribute('data-fid'))));
  requestAnimationFrame(()=>{
    fitFunnelTokens(g);
    document.querySelectorAll('#funnelCanvas .fstage-inner').forEach(el=>trimFunnelOverflow(el));
  });
}

/* Token size adapts to the project count: the largest diameter at which every band still fits
   its projects, taken over all bands so all tokens stay the same size. */
const FTOK_MAX = 88, FTOK_MIN = 34, FTOK_GAP = 6;
function fitDiameter(w, h, n){
  if(n<=0) return FTOK_MAX;
  for(let d=FTOK_MAX; d>=FTOK_MIN; d--){
    const cols = Math.max(1, Math.floor((w+FTOK_GAP)/(d+FTOK_GAP)));
    if(Math.ceil(n/cols)*(d+FTOK_GAP)-FTOK_GAP <= h) return d;
  }
  return FTOK_MIN;
}
function fitFunnelTokens(g){
  const canvas = document.getElementById('funnelCanvas');
  const cap = document.getElementById('funnelCapture');
  if(!canvas || !cap || !canvas.clientWidth) return;
  let d = FTOK_MAX;
  STATUS_ORDER.forEach((s,i)=>{
    const b = FUNNEL_BOUNDS[i];
    d = Math.min(d, fitDiameter(canvas.clientWidth*b.width/100-10, canvas.clientHeight*b.height/100-8, g.bands[i].length));
  });
  cap.querySelectorAll('.fside-wrap').forEach(el=>{
    const n = el.querySelectorAll('.ftok').length;
    if(n) d = Math.min(d, fitDiameter(el.clientWidth-4, FTOK_MAX*2, n));
  });
  const st = cap.style;
  st.setProperty('--ftokD', d+'px');
  st.setProperty('--ftokF', Math.max(6.5, Math.min(10.5, d*0.118)).toFixed(1)+'px');
  st.setProperty('--ftokP', Math.max(3, Math.round(d*0.10))+'px');
  st.setProperty('--fbadgeD', Math.max(14, Math.round(d*0.26))+'px');
  st.setProperty('--fbadgeF', Math.max(6.5, d*0.105).toFixed(1)+'px');
}
/* If a band still can't show everything at the minimum size, the tail becomes one "+N" token
   so nothing is silently cut off. */
function trimFunnelOverflow(el){
  let hidden = 0, guard = 0;
  while(el.scrollHeight > el.clientHeight+2 && el.querySelectorAll('.ftok').length>1 && guard++<200){
    el.querySelector('.ftok:last-of-type').remove();
    hidden++;
  }
  if(hidden>0){
    const last = el.querySelector('.ftok:last-of-type');
    if(last) last.remove();
    el.insertAdjacentHTML('beforeend', `<div class="ftok more" title="${hidden+1} more projects">+${hidden+1}</div>`);
  }
}

function stepFunnelDetail(dir){

function funnelBox(title, body, stripe){

function renderFunnelDetail(){

  }).join('');
  const prev = funnelDetailList[(funnelDetailIdx-1+funnelDetailList.length)%funnelDetailList.length];
  const next = funnelDetailList[(funnelDetailIdx+1)%funnelDetailList.length];

      <span class="fd-chip"><i class="catdot" style="background:${ci.bg};color:${ci.fg}">${escapeHtml(ci.code)}</i>${escapeHtml(ci.label)}</span></div>
    <div class="fd-pipe">${pipe}</div>
    <div class="fd-grid">
      <div class="fd-col">${funnelBox('Problem / starting point',p.problem,sc)}${funnelBox('Goal / benefit',p.benefit,sc)}${funnelBox('Next steps / remarks',p.nextSteps,sc)}${funnelBox('Notes',p.notes.trim(),sc)}</div>
      <div class="fd-col">${funnelBox('Project lead',p.lead,sc)}${funnelBox('Region',x.rname,sc)}${funnelBox('Team members involved',p.team,sc)}${funnelBox('External partners',p.partners,sc)}</div>
    </div>
    <div class="fd-nav">
      <button class="fbtn" data-fd="close">← Back to funnel</button>
      <span class="mono" style="font-size:12px;color:var(--ink-soft)">${funnelDetailIdx+1} of ${funnelDetailList.length}</span>
      <span style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="fbtn" data-fd="prev">‹ ${escapeHtml(prev.title.slice(0,24))}</button>
        <button class="fbtn" data-fd="next">${escapeHtml(next.title.slice(0,24))} ›</button>
        ${canEdit?'<button class="fbtn" data-fd="edit">Edit in Exchange Mode</button>':''}
      </span>
    </div>
    <div class="fd-foot" style="background-image:url('${BRAND_GRADIENT}')"></div>

  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeFunnelDetail(); });

  overlay.querySelector('[data-fd="next"]').addEventListener('click', ()=>stepFunnelDetail(1));

}
document.addEventListener('keydown', e=>{

});

const PPTX_SRC = 'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';
const H2C_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
const JSPDF_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const _scriptLoads = {};
function loadScriptOnce(src){
  if(!_scriptLoads[src]){
    _scriptLoads[src] = new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = ()=>{ delete _scriptLoads[src]; reject(new Error('Could not load '+src.split('/').pop()+' — check your network connection and try again.')); };
      document.head.appendChild(s);
    });
  }
  return _scriptLoads[src];
}
async function runExport(btn, fn){
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Preparing…';
  try{ await fn(); }
  catch(e){ console.error('Export failed', e); alert('Export failed: '+(e && e.message || e)); }
  finally{ btn.disabled = false; btn.textContent = label; }
}
function exportFileName(ext){
  const scope = funnelScope==='all' ? 'All' : funnelScopeLabel(funnelScope);
  const cat = funnelCat ? '_'+funnelCat.replace(/[^A-Za-z0-9]+/g,'_') : '';
  return 'SPI_Funnel_'+scope+cat+'.'+ext;
}
