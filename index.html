/* Same header band on every slide: brand gradient, white title, logo on the right. The
   gradient and logo live on two slide masters so the file stores them once, not per slide —
   the band images are cropped to the exact band shape here because masters can't crop. */
const PPT_HEADER_H = 0.78, PPT_FOOTER_Y = 7.34, PPT_FOOTER_H = 0.16;
function cropCover(src, aspect){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let sw = img.width, sh = Math.round(img.width/aspect);
      if(sh > img.height){ sh = img.height; sw = Math.round(sh*aspect); }
      const c = document.createElement('canvas');
      c.width = sw; c.height = sh;
      c.getContext('2d').drawImage(img, (img.width-sw)/2, (img.height-sh)/2, sw, sh, 0, 0, sw, sh);
      resolve(c.toDataURL('image/jpeg', 0.9));
    };
    img.onerror = ()=>reject(new Error('Could not prepare the brand gradient'));
    img.src = src;
  });
}
async function pptDefineMasters(pptx){
  const band = await cropCover(BRAND_GRADIENT, 13.33/PPT_HEADER_H);
  const strip = await cropCover(BRAND_GRADIENT, 13.33/PPT_FOOTER_H);
  const logoH = 1.32*120/620;
  const header = [
    {image:{x:0, y:0, w:13.33, h:PPT_HEADER_H, data:band}},
    {image:{x:11.62, y:PPT_HEADER_H/2-logoH/2, w:1.32, h:logoH, data:BRAND_LOGO}}
  ];
  pptx.defineSlideMaster({title:'SPI_OVERVIEW', background:{color:'FFFFFF'}, objects:header});
  pptx.defineSlideMaster({title:'SPI_DETAIL', background:{color:'FFFFFF'}, objects:header.concat([
    {image:{x:0, y:PPT_FOOTER_Y, w:13.33, h:PPT_FOOTER_H, data:strip}},
    {text:{text:'Bühler AG · SPI Global Exchange', options:{x:0.4, y:7.1, w:8, h:0.2, fontSize:8, color:'8AA0AC'}}}
  ])});
}
function pptHeader(slide, title){
  slide.addText(String(title||''), {x:0.45, y:0.1, w:10.6, h:PPT_HEADER_H-0.2, fontSize:22, bold:true, color:'FFFFFF', valign:'middle', fit:'shrink'});
}
/* Native funnel band: the sampled polygon as a custom shape, points in EMU relative to its box. */
function pptBand(slide, i, fx, fy, fw, fh){
  const EMU = 914400, pts = bandPolygon(i, 14);
  const x0 = FUNNEL_SPLITS[i], w = FUNNEL_SPLITS[i+1]-x0;
  const shapeX = fx+fw*(x0/FUNNEL_W), shapeW = fw*(w/FUNNEL_W);
  const ys = pts.map(p=>p[1]), yMin = Math.min(...ys), yMax = Math.max(...ys);
  const shapeY = fy+fh*(yMin/FUNNEL_H), shapeH = fh*((yMax-yMin)/FUNNEL_H);
  const points = pts.map(p=>({x:Math.round(((p[0]-x0)/w)*shapeW*EMU), y:Math.round(((p[1]-yMin)/(yMax-yMin))*shapeH*EMU)}));
  slide.addShape('custGeom', {x:shapeX, y:shapeY, w:shapeW, h:shapeH, fill:{color:STAGE_HEX[STATUS_ORDER[i]]}, line:{type:'none'}, points});
}
const PPT_CIRCLE_MAX = 0.86, PPT_CIRCLE_MIN = 0.44, PPT_CIRCLE_GAP = 0.07;
let PPT_CIRCLE_D = 0.72;
function pptFitCircleD(w, h, n){
  if(n<=0) return PPT_CIRCLE_MAX;
  for(let d=PPT_CIRCLE_MAX; d>=PPT_CIRCLE_MIN; d-=0.01){
    const cols = Math.max(1, Math.floor((w+PPT_CIRCLE_GAP)/(d+PPT_CIRCLE_GAP)));
    if(Math.ceil(n/cols)*(d+PPT_CIRCLE_GAP)-PPT_CIRCLE_GAP <= h) return Math.round(d*100)/100;
  }
  return PPT_CIRCLE_MIN;
}
function pptCircleRows(n, w){ const cols = Math.max(1, Math.floor((w+PPT_CIRCLE_GAP)/(PPT_CIRCLE_D+PPT_CIRCLE_GAP))); return Math.max(1, Math.ceil(n/cols)); }
/* Text width estimate in inches; wide and narrow glyphs are told apart so line breaks hold. */
function pptTxtWidth(s, fs){
  let u = 0;
  for(const ch of String(s)){
    if(/[mMwW@—]/.test(ch)) u += 0.88;
    else if(/[iljItf1.,;:'"!\[\]()|\/ ]/.test(ch)) u += 0.31;
    else if(/[A-Z0-9ÄÖÜ]/.test(ch)) u += 0.63;
    else u += 0.53;
  }
  return u*fs/72;
}
function pptWrapTokens(t){
  const out = [];
  t.split(/\s+/).filter(Boolean).forEach(word=>{
    word.split(/(?<=[-\/])/).forEach((part,pi)=>out.push({s:part, glue:pi>0}));
  });
  return out;
}
/* Break a word as late as possible, preferably between two consonants before a vowel,
   otherwise before a single consonant between two vowels. */
const PPT_VOWEL = /[aeiouäöüyAEIOUÄÖÜY]/;
function pptHyphenAt(w, fs, maxW){
  let hi = w.length-1;
  while(hi>2 && pptTxtWidth(w.slice(0,hi)+'-', fs) > maxW) hi--;
  if(hi<=2) return 0;
  const top = Math.min(hi, w.length-3), V = i=>PPT_VOWEL.test(w[i]), C = i=>!PPT_VOWEL.test(w[i]);
  let c1 = 0; for(let i=top; i>=3; i--) if(C(i-1)&&C(i)&&V(i+1)){ c1 = i; break; }
  let c2 = 0; for(let i=top; i>=3; i--) if(V(i-1)&&C(i)&&V(i+1)){ c2 = i; break; }
  if(c1||c2) return Math.max(c1,c2);
  for(let i=top; i>=3; i--) if(V(i-1)&&C(i)) return i;
  return hi;
}
function pptLayoutLines(tokens, fs, maxW){
  const lines = []; let cur = '';
  for(const tk of tokens){
    const test = cur ? (tk.glue ? cur+tk.s : cur+' '+tk.s) : tk.s;
    if(pptTxtWidth(test, fs) <= maxW){ cur = test; continue; }
    if(cur){ lines.push(cur); cur = ''; }
    let w = tk.s;
    while(pptTxtWidth(w, fs) > maxW){
      const i = pptHyphenAt(w, fs, maxW);
      if(!i) return null;
      lines.push(w.slice(0,i)+'-'); w = w.slice(i);
    }
    cur = w;
  }
  if(cur) lines.push(cur);
  return lines;
}
/* Wrap the title ourselves and pick the largest font at which every line fits the token. */
function pptFitCircleText(title, d){
  const t = String(title||'').trim();
  if(!t) return {text:'', size:8};
  const maxW = d*0.76, maxH = d*0.70, tokens = pptWrapTokens(t);
  const fsStart = Math.max(6, Math.min(14, Math.round(d*15*2)/2));
  let clean = null, any = null;
  for(let fs=fsStart; fs>=5; fs-=0.5){
    const lh = fs*1.16/72;
    const lines = pptLayoutLines(tokens, fs, maxW);
    if(!lines || lines.length*lh > maxH) continue;
    const noBreak = !tokens.some(tk=>pptTxtWidth(tk.s, fs) > maxW);
    if(!any) any = {text:lines.join('\n'), size:fs};
    if(noBreak){ clean = {text:lines.join('\n'), size:fs}; break; }
  }
  const best = (clean && (!any || any.size-clean.size < 1.5)) ? clean : (any || clean);
  if(best) return best;
  const fs = 5, lh = fs*1.16/72, maxLines = Math.max(1, Math.floor(maxH/lh));
  const lines = (pptLayoutLines(tokens, fs, maxW) || [t]).slice(0, maxLines);
  if(lines.length===maxLines) lines[maxLines-1] = lines[maxLines-1].replace(/-$/,'')+'…';
  return {text:lines.join('\n'), size:fs};
}
/* Equal-size teardrop tokens in a centred grid; overflow collapses into one "+N" token. */
function pptCircles(slide, items, x, y, w, style, availH){
  const d = PPT_CIRCLE_D, gap = PPT_CIRCLE_GAP, n = items.length;
  if(!n) return 0;
  const cols = Math.max(1, Math.floor((w+gap)/(d+gap)));
  const maxRows = availH ? Math.max(1, Math.floor((availH+gap)/(d+gap))) : Infinity;
  const capacity = cols*maxRows;
  let shown = items, plus = 0;
  if(n>capacity){ shown = items.slice(0, capacity-1); plus = n-(capacity-1); }
  const total = shown.length + (plus>0?1:0);
  const rows = Math.ceil(total/cols);
  const neededH = rows*(d+gap)-gap;
  const startY = y + (availH ? Math.max(0, (availH-neededH)/2) : 0);
  for(let row=0; row<rows; row++){
    const rowStart = row*cols, rowCount = Math.min(cols, total-rowStart);
    const rowX = x + (w-(rowCount*(d+gap)-gap))/2;
    for(let col=0; col<rowCount; col++){
      const idx = rowStart+col;
      const cx = rowX+col*(d+gap)+d/2, cy = startY+row*(d+gap)+d/2;
      if(idx<shown.length){
        const it = shown[idx], ci = catInfo(it.p.classification);
        const fill = style==='gray' ? 'CFCFC6' : style==='dark' ? '0B3948' : 'FFFFFF';
        const txt = style==='dark' ? 'FFFFFF' : '0B3948';
        slide.addShape('teardrop', {x:cx-d/2, y:cy-d/2, w:d, h:d, rotate:270, fill:{color:fill}, line:style?{type:'none'}:{color:'D6E4E4', width:.5}});
        const ft = pptFitCircleText(it.title, d);
        slide.addText(ft.text, {x:cx-d/2+0.04, y:cy-d/2+0.04, w:d-0.08, h:d-0.08, fontSize:ft.size, align:'center', valign:'middle', color:txt, wrap:false, lineSpacingMultiple:0.96});
        if(!style){
          const bd = Math.max(0.15, Math.min(0.22, d*0.28));
          slide.addShape('ellipse', {x:cx+d/2-bd*0.85, y:cy+d/2-bd*0.85, w:bd, h:bd, fill:{color:ci.bgHex}, line:{color:'FFFFFF', width:1}});
          slide.addText(ci.code, {x:cx+d/2-bd*0.85, y:cy+d/2-bd*0.85, w:bd, h:bd, fontSize:Math.max(5, Math.min(7.5, bd*33)), bold:true, align:'center', valign:'middle', color:ci.fgHex, wrap:false});
        }
      }else{
        const fill = style==='gray' ? 'CFCFC6' : style==='dark' ? '0B3948' : 'E4F0EF';
        slide.addShape('teardrop', {x:cx-d/2, y:cy-d/2, w:d, h:d, rotate:270, fill:{color:fill}, line:{color:'A8C7D2', width:.75}});
        slide.addText('+'+plus, {x:cx-d/2, y:cy-d/2, w:d, h:d, fontSize:9, bold:true, align:'center', valign:'middle', color:style==='dark'?'FFFFFF':'0B3948'});
      }
    }
  }
  return neededH;
}
function pptPlanLegend(items, legW){
  const cats = Array.from(new Set(items.map(x=>catInfo(x.p.classification).label))).map(l=>catInfo(l==='Unclassified'?'':l));
  const padX = 0.16, padY = 0.13, rowH = 0.26, badge = 0.19, gapX = 0.3, titleH = 0.24;
  if(!cats.length) return {cats, rows:0, cols:0, colW:0, h:0.34, padX, padY, rowH, badge, titleH};
  const colW = Math.max(...cats.map(ci=>badge+0.08+pptTxtWidth(ci.label, 9))) + gapX;
  const avail = legW-padX*2;
  const cols = Math.max(1, Math.min(cats.length, Math.floor(avail/colW)));
  const rows = Math.ceil(cats.length/cols);
  return {cats, rows, cols, colW:avail/cols, h:padY*2+titleH+rows*rowH, padX, padY, rowH, badge, titleH};
}
function pptLegend(slide, p, fx, legY, legW){
  slide.addShape('roundRect', {x:fx, y:legY, w:legW, h:p.h, rectRadius:0.06, fill:{color:'FBFCFD'}, line:{color:'D6E4E4', width:1}});
  slide.addText('Classification', {x:fx+p.padX, y:legY+p.padY, w:legW-p.padX*2, h:p.titleH, fontSize:9.5, bold:true, color:'0B3948', valign:'middle'});
  p.cats.forEach((ci,i)=>{
    const r = Math.floor(i/p.cols), c = i%p.cols;
    const x = fx+p.padX+c*p.colW, y = legY+p.padY+p.titleH+r*p.rowH;
    slide.addShape('ellipse', {x, y:y+(p.rowH-p.badge)/2, w:p.badge, h:p.badge, fill:{color:ci.bgHex}, line:{type:'none'}});
    slide.addText(ci.code, {x, y:y+(p.rowH-p.badge)/2, w:p.badge, h:p.badge, fontSize:6.5, bold:true, align:'center', valign:'middle', color:ci.fgHex, wrap:false});
    slide.addText(ci.label, {x:x+p.badge+0.07, y, w:p.colW-p.badge-0.12, h:p.rowH, fontSize:9, color:'122229', valign:'middle', wrap:false});
  });
}
/* Plan bottom-up: legend and holding boxes are measured first, the funnel gets the rest. */
function pptOverviewSlide(pptx, g){
  const slide = pptx.addSlide({masterName:'SPI_OVERVIEW'});
  pptHeader(slide, funnelTitle());
  if(funnelCat) slide.addText('Classification: '+funnelCat, {x:0.45, y:PPT_HEADER_H+0.02, w:8, h:0.22, fontSize:9, color:'5C7A88'});
  const fx = 0.4, fy = 1.15, fw = 12.5, SLIDE_H = 7.5;
  const all = funnelOrdered(g);
  const legendPlan = pptPlanLegend(all, fw);
  const boxW = 4.05, boxGap = 0.14, boxPadTop = 0.17, boxPadBottom = 0.04;
  const boxGroups = [['On hold',g.onHold,'gray'],['Stopped',g.stopped,'gray'],['Archived',g.archived,'dark']];
  const fhGuess = Math.max(2.4, SLIDE_H-0.28-fy-0.16-1.0-0.14-legendPlan.h);
  PPT_CIRCLE_D = Math.min(
    ...STATUS_ORDER.map((s,i)=>pptFitCircleD(fw*(FUNNEL_BOUNDS[i].width/100)-0.28, fhGuess*(FUNNEL_BOUNDS[i].height/100)-0.2, g.bands[i].length)),
    ...boxGroups.map(([,list])=>list.length ? pptFitCircleD(boxW-0.2, 1.5, list.length) : PPT_CIRCLE_MAX)
  );
  const boxH = Math.max(0.44, ...boxGroups.map(([,list])=>list.length ? boxPadTop+pptCircleRows(list.length, boxW-0.2)*(PPT_CIRCLE_D+PPT_CIRCLE_GAP)-PPT_CIRCLE_GAP+boxPadBottom : boxPadTop+0.08));
  const fh = Math.max(2.4, SLIDE_H-0.28-fy-0.16-boxH-0.14-legendPlan.h);
  STATUS_ORDER.forEach((s,i)=>{
    const b = FUNNEL_BOUNDS[i];
    slide.addText(s, {x:fx+fw*(b.left/100)+0.05, y:fy-0.3, w:fw*(b.width/100)-0.1, h:0.24, fontSize:12, bold:true, color:'0B3948'});
    pptBand(slide, i, fx, fy, fw, fh);
    pptCircles(slide, g.bands[i], fx+fw*(b.left/100)+0.14, fy+fh*(b.top/100)+0.1, fw*(b.width/100)-0.28, null, fh*(b.height/100)-0.2);
  });
  const boxY = fy+fh+0.16;
  boxGroups.forEach(([label,list,style],i)=>{
    const x = fx+i*(boxW+boxGap);
    slide.addShape('roundRect', {x, y:boxY, w:boxW, h:boxH, rectRadius:0.06, fill:{color:'FBFCFD'}, line:{color:'D8E3E8', width:1}});
    slide.addText(label, {x:x+0.1, y:boxY+0.035, w:boxW-0.2, h:0.16, fontSize:8.5, bold:true, color:'0B3948'});
    if(list.length) pptCircles(slide, list, x+0.1, boxY+boxPadTop, boxW-0.2, style, boxH-boxPadTop-boxPadBottom);
  });
  pptLegend(slide, legendPlan, fx, boxY+boxH+0.14, boxW*3+boxGap*2);
}
function pptDetailSlide(pptx, x){
  const p = x.p, slide = pptx.addSlide({masterName:'SPI_DETAIL'});
  const ci = catInfo(p.classification), sc = STAGE_HEX[p.status] || '8A94A6';
  pptHeader(slide, x.title);
  slide.addText('SPI Global Exchange · '+x.rname+(p.archived?' · archived':''), {x:0.4, y:0.88, w:7.5, h:0.26, fontSize:10.5, color:'5C7A88', valign:'middle'});
  const chipW = 0.34+pptTxtWidth(ci.label,10)+0.2, chipX = 12.9-chipW;
  slide.addShape('roundRect', {x:chipX, y:0.88, w:chipW, h:0.26, rectRadius:0.13, fill:{color:'F2F7F7'}, line:{color:'D6E4E4', width:.75}});
  slide.addShape('ellipse', {x:chipX+0.05, y:0.905, w:0.21, h:0.21, fill:{color:ci.bgHex}, line:{type:'none'}});
  slide.addText(ci.code, {x:chipX+0.05, y:0.905, w:0.21, h:0.21, fontSize:7, bold:true, align:'center', valign:'middle', color:ci.fgHex, wrap:false});
  slide.addText(ci.label, {x:chipX+0.3, y:0.88, w:chipW-0.36, h:0.26, fontSize:10, color:'122229', valign:'middle', wrap:false});
  const pipeW = 12.5, segW = pipeW/STATUS_ALL.length, pipeY = 1.28, pipeH = 0.34;
  STATUS_ALL.forEach((s,i)=>{
    const on = s===p.status;
    slide.addShape('roundRect', {x:0.4+i*segW, y:pipeY, w:segW-0.07, h:pipeH, rectRadius:0.06, fill:{color:on?STAGE_HEX[s]:'EEF4F4'}, line:{type:'none'}});
    slide.addText(s, {x:0.4+i*segW, y:pipeY, w:segW-0.07, h:pipeH, fontSize:8, bold:on, align:'center', valign:'middle', color:on?(STATUS_DARK_TEXT[s]?'122229':'FFFFFF'):'5C7A88'});
  });
  const colY = 1.94, leftX = 0.4, leftW = 7.05, rightX = 7.68, rightW = 5.22, gap = 0.14, bottomY = 7.06;
  function box(x0, y0, w0, h0, title, body, fs){
    slide.addShape('roundRect', {x:x0, y:y0, w:w0, h:h0, rectRadius:0.07, fill:{color:'FBFCFD'}, line:{color:'D6E4E4', width:1}});
    slide.addShape('roundRect', {x:x0, y:y0+0.04, w:0.055, h:h0-0.08, rectRadius:0.03, fill:{color:sc}, line:{type:'none'}});
    slide.addText(String(title).toUpperCase(), {x:x0+0.18, y:y0+0.07, w:w0-0.32, h:0.2, fontSize:8.5, bold:true, color:'0B3948', charSpacing:0.6});
    slide.addText((body||'').trim()||'—', {x:x0+0.18, y:y0+0.29, w:w0-0.34, h:h0-0.38, fontSize:fs||10, color:'122229', valign:'top', fit:'shrink'});
  }
  const rows = 4, h = (bottomY-colY-(rows-1)*gap)/rows;
  [['Problem / starting point',p.problem],['Goal / benefit',p.benefit],['Next steps / remarks',p.nextSteps],['Notes',p.notes]]
    .forEach(([t,v],i)=>box(leftX, colY+i*(h+gap), leftW, h, t, v));
  [['Project lead',p.lead],['Region',x.rname],['Team members involved',p.team],['External partners',p.partners]]
    .forEach(([t,v],i)=>box(rightX, colY+i*(h+gap), rightW, h, t, v, 9.5));
}

/* ---------------- User management cockpit ----------------
   Admins only. The cockpit password is checked server-side against a bcrypt hash in spi_admin
   (never readable from the browser); users and region access are written through
   admin_save_users(). The password is kept in memory only while the cockpit is open.
   Note: region access controls which views someone gets — it isn't a security boundary,
   since the project data itself is readable by everyone with the link. */
let adminPass = null;
let adminDraft = [];
function adminRegions(){ return DATA ? DATA.regions.map(r=>({id:r.id, code:r.code})) : []; }
function adminErrText(e){
  const m = String((e && e.message) || e || '');
  if(/wrong admin password/i.test(m)) return 'Wrong password.';
  if(/wrong setup code/i.test(m)) return 'The setup code does not match. Copy it again from the Supabase SQL result.';
  if(/already set/i.test(m)) return 'An admin password is already set. Reload the page and log in.';
  if(/too short/i.test(m)) return 'The password needs at least 8 characters.';
  if(/at least one admin/i.test(m)) return 'Keep at least one admin, otherwise nobody can open this cockpit any more.';
  return 'That did not work: '+m;
}
function adminShell(bodyHtml){
  const old = document.getElementById('adminOverlay');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.id = 'adminOverlay';
  overlay.className = 'fd-overlay';
  overlay.innerHTML = `<div class="fd-sheet adm-sheet" role="dialog" aria-label="User management">
    <div class="fd-head" style="background-image:url('${BRAND_GRADIENT}')"><h2>User management</h2><img src="${BRAND_LOGO}" alt="Bühler"></div>
    <div class="adm-body">${bodyHtml}</div>
  </div>`;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeAdmin(); });
  document.body.appendChild(overlay);
  overlay.querySelectorAll('[data-adm="close"]').forEach(b=>b.addEventListener('click', closeAdmin));
  return overlay;
}
function closeAdmin(){
  adminPass = null; adminDraft = [];
  const o = document.getElementById('adminOverlay'); if(o) o.remove();
}
async function openAdmin(){
  if(!isAdminUser(currentUser)) return;
  adminPass = null;
  let status = 'unavailable';
  try{ const {data, error} = await sb.rpc('admin_status'); if(error) throw error; status = data; }catch(e){ console.warn('admin_status', e); }
  if(status==='setup') renderAdminSetup();
  else if(status==='ready') renderAdminLogin();
  else adminShell(`<p>The user management tables aren't set up in Supabase yet. Run the setup SQL in the Supabase SQL editor first, then reload this page.</p>
    <div class="adm-actions"><button class="fbtn" data-adm="close">Close</button></div>`);
}
function renderAdminLogin(){
  const o = adminShell(`<p>Enter the cockpit password.</p>
    <form class="adm-form" id="admLoginForm" autocomplete="off">
      <label>Password<input type="password" id="admPw" autocomplete="current-password" required></label>
      <div class="adm-err" id="admErr" hidden></div>
      <div class="adm-actions"><button type="button" class="fbtn" data-adm="close">Cancel</button><button type="submit" class="fbtn adm-primary">Unlock</button></div>
    </form>`);
  const pw = o.querySelector('#admPw'); pw.focus();
  o.querySelector('#admLoginForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const err = o.querySelector('#admErr'); err.hidden = true;
    try{
      const {data, error} = await sb.rpc('admin_check', {p_password: pw.value});
      if(error) throw error;
      if(!data){ err.textContent = 'Wrong password.'; err.hidden = false; pw.select(); return; }
      adminPass = pw.value;
      renderAdminUsers();
    }catch(ex){ err.textContent = adminErrText(ex); err.hidden = false; }
  });
}
function renderAdminSetup(){
  const o = adminShell(`<p>No cockpit password is set yet. Enter the one-time setup code shown in the Supabase SQL result, then choose your password (at least 8 characters).</p>
    <form class="adm-form" id="admSetupForm" autocomplete="off">
      <label>Setup code<input type="text" id="admCode" autocomplete="off" required></label>
      <label>New password<input type="password" id="admNew" autocomplete="new-password" required minlength="8"></label>
      <label>Repeat password<input type="password" id="admNew2" autocomplete="new-password" required minlength="8"></label>
      <div class="adm-err" id="admErr" hidden></div>
      <div class="adm-actions"><button type="button" class="fbtn" data-adm="close">Cancel</button><button type="submit" class="fbtn adm-primary">Set password</button></div>
    </form>`);
  o.querySelector('#admCode').focus();
  o.querySelector('#admSetupForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const err = o.querySelector('#admErr'); err.hidden = true;
    const code = o.querySelector('#admCode').value.trim(), p1 = o.querySelector('#admNew').value, p2 = o.querySelector('#admNew2').value;
    if(p1.length<8){ err.textContent = 'The password needs at least 8 characters.'; err.hidden = false; return; }
    if(p1!==p2){ err.textContent = "The two passwords don't match."; err.hidden = false; return; }
    try{
      const {error} = await sb.rpc('admin_setup', {p_code: code, p_password: p1});
      if(error) throw error;
      adminPass = p1;
      renderAdminUsers('Password set. From now on the cockpit asks for it.');
    }catch(ex){ err.textContent = adminErrText(ex); err.hidden = false; }
  });
}
function adminRowHtml(u, i){
  const regions = adminRegions(), all = u.access.includes('all');
  return `<tr data-row="${i}">
    <td><input type="text" class="adm-name" value="${escapeHtml(u.name)}" aria-label="Name"></td>
    <td class="adm-c"><input type="checkbox" class="adm-all" ${all?'checked':''} aria-label="All regions"></td>
    ${regions.map(r=>`<td class="adm-c"><input type="checkbox" class="adm-reg" data-reg="${r.id}" ${!all && u.access.includes(r.id)?'checked':''} ${all?'disabled':''} aria-label="${r.code}"></td>`).join('')}
    <td class="adm-c"><input type="checkbox" class="adm-admin" ${u.admin?'checked':''} aria-label="Admin"></td>
    <td class="adm-c"><button type="button" class="adm-del" data-del="${i}" aria-label="Remove ${escapeHtml(u.name)}">&times;</button></td>
  </tr>`;
}
function readAdminDraft(o){
  o.querySelectorAll('tr[data-row]').forEach(tr=>{
    const u = adminDraft[+tr.getAttribute('data-row')];
    u.name = tr.querySelector('.adm-name').value.trim();
    u.admin = tr.querySelector('.adm-admin').checked;
    u.access = tr.querySelector('.adm-all').checked ? ['all'] : [...tr.querySelectorAll('.adm-reg:checked')].map(c=>c.getAttribute('data-reg'));
  });
}
function renderAdminUsers(message){
  if(!adminPass) return renderAdminLogin();
  if(!adminDraft.length) adminDraft = USERS.map(u=>({...u, access:u.access.slice(), orig:u.name}));
  const regions = adminRegions();
  const o = adminShell(`${message?`<div class="adm-ok">${escapeHtml(message)}</div>`:''}
    <p class="adm-hint">Region access decides which regions someone sees in Prep, Exchange Mode and Follow-up Tasks. Global and the Dashboard stay visible for everyone. Admins can open this cockpit.</p>
    <div class="adm-table-wrap"><table class="adm-table">
      <thead><tr><th>Name</th><th class="adm-c">All regions</th>${regions.map(r=>`<th class="adm-c">${r.code}</th>`).join('')}<th class="adm-c">Admin</th><th></th></tr></thead>
      <tbody>${adminDraft.map((u,i)=>adminRowHtml(u,i)).join('')}</tbody>
    </table></div>
    <button type="button" class="add-project-toggle" id="admAdd">+ Add user</button>
    <div class="adm-err" id="admErr" hidden></div>
    <div class="adm-actions"><button type="button" class="fbtn" data-adm="close">Close</button><button type="button" class="fbtn adm-primary" id="admSave">Save changes</button></div>
    <details class="adm-pwchange"><summary>Change cockpit password</summary>
      <form class="adm-form" id="admPwForm" autocomplete="off">
        <label>New password<input type="password" id="admNew" autocomplete="new-password" minlength="8" required></label>
        <label>Repeat password<input type="password" id="admNew2" autocomplete="new-password" minlength="8" required></label>
        <div class="adm-err" id="admPwErr" hidden></div>
        <div class="adm-actions"><button type="submit" class="fbtn">Change password</button></div>
      </form>
    </details>`);
  o.querySelectorAll('.adm-all').forEach(cb=>cb.addEventListener('change', ()=>{
    cb.closest('tr').querySelectorAll('.adm-reg').forEach(r=>{ r.disabled = cb.checked; if(cb.checked) r.checked = false; });
  }));
  o.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    readAdminDraft(o);
    adminDraft.splice(+b.getAttribute('data-del'), 1);
    renderAdminUsers();
  }));
  o.querySelector('#admAdd').addEventListener('click', ()=>{
    readAdminDraft(o);
    adminDraft.push({name:'', access:[], admin:false, orig:''});
    renderAdminUsers();
    const inputs = document.querySelectorAll('#adminOverlay .adm-name');
    inputs[inputs.length-1].focus();
  });
  o.querySelector('#admSave').addEventListener('click', ()=>saveAdminUsers(o));
  o.querySelector('#admPwForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const err = o.querySelector('#admPwErr'); err.hidden = true;
    const p1 = o.querySelector('#admNew').value, p2 = o.querySelector('#admNew2').value;
    if(p1.length<8){ err.textContent = 'The password needs at least 8 characters.'; err.hidden = false; return; }
    if(p1!==p2){ err.textContent = "The two passwords don't match."; err.hidden = false; return; }
    try{
      const {error} = await sb.rpc('admin_change_password', {p_old: adminPass, p_new: p1});
      if(error) throw error;
      adminPass = p1;
      readAdminDraft(o);
      renderAdminUsers('Cockpit password changed.');
    }catch(ex){ err.textContent = adminErrText(ex); err.hidden = false; }
  });
}
async function saveAdminUsers(o){
  readAdminDraft(o);
  const err = o.querySelector('#admErr'); err.hidden = true;
  const fail = t=>{ err.textContent = t; err.hidden = false; };
  const rows = adminDraft.filter(u=>u.name || u.orig);
  if(rows.some(u=>!u.name)) return fail('Every user needs a name. Remove empty rows with ×.');
  const lower = rows.map(u=>u.name.toLowerCase());
  const dup = lower.find((n,i)=>lower.indexOf(n)!==i);
  if(dup) return fail('The name "'+rows[lower.indexOf(dup)].name+'" is used twice.');
  const noRegion = rows.find(u=>!u.access.length);
  if(noRegion) return fail('Pick "All regions" or at least one region for '+noRegion.name+'.');
  if(!rows.some(u=>u.admin)) return fail('Keep at least one admin, otherwise nobody can open this cockpit any more.');
  const btn = o.querySelector('#admSave'); btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const {error} = await sb.rpc('admin_save_users', {p_users: rows.map(u=>({name:u.name, access:u.access, admin:u.admin})), p_password: adminPass});
    if(error) throw error;
    /* Renamed users keep their authorship on prep items and session notes. */
    const renames = {};
    rows.forEach(u=>{ if(u.orig && u.orig!==u.name) renames[u.orig] = u.name; });
    if(Object.keys(renames).length && DATA){
      DATA.prepItems.forEach(i=>{ if(renames[i.author]) i.author = renames[i.author]; });
      DATA.regions.concat([DATA.global]).forEach(r=>(r.log||[]).forEach(l=>{ if(renames[l.author]) l.author = renames[l.author]; }));
      await saveData();
    }
    if(renames[currentUser]){ currentUser = renames[currentUser]; try{ localStorage.setItem('spi_currentUser', currentUser); }catch(e){} }
    applyUsers(rows);
    usersFromDb = true;
    if(!KNOWN_USERS.includes(currentUser)){ currentUser = ''; try{ localStorage.removeItem('spi_currentUser'); }catch(e){} }
    adminDraft = rows.map(u=>({...u, access:u.access.slice(), orig:u.name}));
    updateWhoAmI();
    if(DATA) renderTab();
    if(!isAdminUser(currentUser)){ closeAdmin(); return; }
    renderAdminUsers('Saved. The changes apply to everyone after they reload the page.');
  }catch(ex){
    btn.disabled = false; btn.textContent = 'Save changes';
    if(/wrong admin password/i.test(String(ex && ex.message))){ adminPass = null; renderAdminLogin(); return; }
    fail(adminErrText(ex));
  }
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && document.getElementById('adminOverlay')) closeAdmin(); });

/* ---------------- Nav / shell ---------------- */
function setActiveNav(tab){
  document.querySelectorAll('#mainNav button').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-tab')===tab);
  });
}

function renderTab(){
  if(currentTab==='dashboard') renderDashboard();
  else if(currentTab==='funnel') renderFunnelTab();
  else if(currentTab==='prep') renderPrep();
  else if(currentTab==='exchange') renderExchange();
  else if(currentTab==='tasks') renderTasks();
  renderHeroStats();
}

document.getElementById('mainNav').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  const tab = btn.getAttribute('data-tab');
  if(tab !== 'dashboard' && tab !== 'funnel'){
    const user = await getCurrentUser();
    if(!user) return;
  }
  currentTab = tab;
  setActiveNav(currentTab);
  renderTab();
});

document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if(confirm('Clear all session notes and prep items? Your regions, projects, statuses, tasks and photos stay exactly as they are.')){
    DATA.regions.forEach(r=>{ r.log = []; });
    DATA.global.log = [];
    DATA.prepItems = [];
    await saveData();
    renderTab();
  }
});

async function doExportBackup(){
  const bundle = {version:1, exportedAt:new Date().toISOString(), data:DATA, images:{}};
  const flat = allProjectsFlat();
  for(const {project} of flat){
    if(project.hasImage){
      const img = await loadProjectImage(project.id);
      if(img) bundle.images[project.id] = img;
    }
  }
  const blob = new Blob([JSON.stringify(bundle)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'spi-exchange-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById('exportBtn').addEventListener('click', doExportBackup);

document.getElementById('importInput').addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const bundle = JSON.parse(reader.result);
      if(!bundle.data || !bundle.data.regions) throw new Error('invalid backup file');
      if(!confirm('Import this backup? It will replace everything currently in this tool (projects, notes, prep, photos).')) return;
      DATA = bundle.data;
      normalizeData();
      await saveData();
      for(const pid in (bundle.images||{})){
        await saveProjectImage(pid, bundle.images[pid]);
      }
      currentTab = 'dashboard';
      setActiveNav('dashboard');
      renderTab();
      alert('Backup imported.');
    }catch(err){
      alert('Could not read that backup file — is it a SPI Exchange export?');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

document.getElementById('whoAmIBtn').addEventListener('click', changeCurrentUser);

document.getElementById('adminBtn').addEventListener('click', openAdmin);

(async function init(){
  await loadUsers();
  currentUser = storedUser();
  updateWhoAmI();
  await loadData();
  renderTab();
  attachRealtimeSync();
})();
